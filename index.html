lly", "pos": "adv", "meaning": "dần dần", "synonym": "little by little", "antonym": "suddenly"}, {"id": 185, "group": 18, "term": "rapidly", "pos": "adv", "meaning": "nhanh chóng", "synonym": "quickly", "antonym": "slowly"}, {"id": 186, "group": 18, "term": "stable", "pos": "adj", "meaning": "ổn định", "synonym": "steady", "antonym": "unstable"}, {"id": 187, "group": 18, "term": "temporary", "pos": "adj", "meaning": "tạm thời", "synonym": "short-term", "antonym": "permanent"}, {"id": 188, "group": 18, "term": "approximately", "pos": "adv", "meaning": "xấp xỉ", "synonym": "about; roughly", "antonym": "exactly"}, {"id": 189, "group": 18, "term": "majority", "pos": "n", "meaning": "đa số", "synonym": "the greater part", "antonym": "minority"}, {"id": 190, "group": 19, "term": "likely", "pos": "adj", "meaning": "có khả năng xảy ra", "synonym": "probable", "antonym": "unlikely"}, {"id": 191, "group": 19, "term": "possible", "pos": "adj", "meaning": "có thể xảy ra", "synonym": "feasible in some contexts", "antonym": "impossible"}, {"id": 192, "group": 19, "term": "claim", "pos": "v", "meaning": "khẳng định, cho rằng", "synonym": "assert", "antonym": "—"}, {"id": 193, "group": 19, "term": "suggest", "pos": "v", "meaning": "gợi ý, hàm ý", "synonym": "indicate; propose", "antonym": "—"}, {"id": 194, "group": 19, "term": "imply", "pos": "v", "meaning": "hàm ý", "synonym": "suggest indirectly", "antonym": "—"}, {"id": 195, "group": 19, "term": "support", "pos": "v", "meaning": "ủng hộ, củng cố", "synonym": "back; provide evidence for", "antonym": "oppose"}, {"id": 196, "group": 19, "term": "oppose", "pos": "v", "meaning": "phản đối", "synonym": "be against", "antonym": "support"}, {"id": 197, "group": 19, "term": "despite", "pos": "prep", "meaning": "mặc dù, bất chấp", "synonym": "in spite of", "antonym": "—"}, {"id": 198, "group": 19, "term": "therefore", "pos": "adv", "meaning": "vì vậy", "synonym": "consequently", "antonym": "—"}, {"id": 199, "group": 19, "term": "whereas", "pos": "conj", "meaning": "trong khi dùng để đối chiếu", "synonym": "while in contrast", "antonym": "—"}], "groups": [{"id": 0, "title": "Cây thông và vòng đời thực vật", "source": "Pine Trees, PDF 122", "kind": "BOOK", "example": "Mature cones release their seeds. → Nón thông trưởng thành giải phóng hạt."}, {"id": 1, "title": "Nghệ thuật và lịch sử", "source": "PDF 121, 126–130", "kind": "BOOK", "example": "Her work inspired younger artists. → Tác phẩm của bà truyền cảm hứng cho nghệ sĩ trẻ."}, {"id": 2, "title": "Nhân vật và hành động", "source": "Tom Sawyer và The Lion King, PDF 128–129", "kind": "BOOK", "example": "He admitted his mistake and asked his friend to forgive him. → Anh ấy nhận lỗi và xin bạn tha thứ."}, {"id": 3, "title": "Cáp quang và công nghệ", "source": "Optical Fiber, PDF 140–141", "kind": "BOOK", "example": "The device transmits signals over long distances. → Thiết bị truyền tín hiệu đi xa."}, {"id": 4, "title": "Lịch sử đếm và hệ thống ký hiệu", "source": "History of Counting, PDF 155–157", "kind": "BOOK", "example": "A simpler method replaced the complicated system. → Một phương pháp đơn giản hơn thay hệ thống phức tạp."}, {"id": 5, "title": "Ô nhiễm và tác động môi trường", "source": "Oil Spills và Acid Rain, PDF 151–154", "kind": "BOOK", "example": "Toxic waste can contaminate water. → Chất thải độc hại có thể làm ô nhiễm nước."}, {"id": 6, "title": "Kiến trúc và đô thị", "source": "The French Quarter, PDF 182–184", "kind": "BOOK", "example": "The district suffered only minor damage. → Khu vực chỉ chịu thiệt hại nhỏ."}, {"id": 7, "title": "Học tập và nghiên cứu nông nghiệp", "source": "George Washington Carver, PDF 199–201", "kind": "BOOK", "example": "The researcher worked diligently to find new uses for the crop. → Nhà nghiên cứu chăm chỉ tìm công dụng mới cho cây trồng."}, {"id": 8, "title": "Không gian và quan sát", "source": "PDF 190, 192–194", "kind": "BOOK", "example": "The telescope helps researchers observe distant objects. → Kính thiên văn giúp nhà nghiên cứu quan sát vật thể xa."}, {"id": 9, "title": "Ngôn ngữ câu hỏi và lập luận", "source": "Câu hỏi, hướng dẫn R2–R7, PDF 125–201", "kind": "BOOK", "example": "The example supports the author's main point. → Ví dụ củng cố ý chính của tác giả."}, {"id": 10, "title": "Giáo dục", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "Attendance is compulsory. → Việc tham dự là bắt buộc."}, {"id": 11, "title": "Việc làm", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "Employees can work flexible hours. → Nhân viên có thể làm giờ linh hoạt."}, {"id": 12, "title": "Môi trường và tài nguyên", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "Renewable energy can reduce reliance on fossil fuels. → Năng lượng tái tạo có thể giảm phụ thuộc nhiên liệu hóa thạch."}, {"id": 13, "title": "Sức khỏe và lối sống", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "A sedentary lifestyle may increase health risks. → Lối sống ít vận động có thể tăng nguy cơ sức khỏe."}, {"id": 14, "title": "Công nghệ và dữ liệu", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "The device stores data automatically. → Thiết bị tự động lưu dữ liệu."}, {"id": 15, "title": "Đời sống cộng đồng", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "Affordable housing benefits local residents. → Nhà ở vừa túi tiền có lợi cho cư dân địa phương."}, {"id": 16, "title": "Kinh tế và tiêu dùng", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "Demand rose while supply remained stable. → Nhu cầu tăng trong khi nguồn cung ổn định."}, {"id": 17, "title": "Nghiên cứu và bằng chứng", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "The findings suggest a link, but do not prove a cause. → Kết quả gợi ý liên hệ nhưng chưa chứng minh nguyên nhân."}, {"id": 18, "title": "Thay đổi và số lượng", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "The population declined gradually. → Dân số giảm dần."}, {"id": 19, "title": "Mức độ và suy luận", "source": "Bộ bổ sung Reading", "kind": "GENERAL", "example": "The policy is likely to help, but success is not guaranteed. → Chính sách có khả năng hữu ích nhưng chưa chắc thành công."}], "passages": [{"title": "Riverside Library", "paragraphs": ["When Riverside Library announced that it would lend tools as well as books, some residents imagined shelves full of expensive machines. The actual collection was modest: a few drills, sewing machines, gardening tools and equipment for measuring rooms. The six-month pilot was designed for people who needed an item occasionally but could not justify buying or storing it. The library wanted to make everyday projects easier, especially for residents living in small apartments. It did not intend to replace professional repair services or supply equipment for commercial building work.", "Adults living in the district can borrow tools after showing a library card and proof of address. There is no additional membership fee. Each person may borrow two items at a time, normally for seven days. A loan can be extended once, but only if nobody else has reserved the item. Reservations may be made online or at the information desk. People without internet access therefore have the same opportunity to join the waiting list, although staff cannot promise that a popular item will be immediately available.", "Borrowers must return equipment while the tool desk is staffed. The ordinary book-return box cannot be used, and leaving a machine outside the building does not count as returning it. This rule allows staff to check whether all the parts are present and to discuss any problems with the borrower. The checks take a few minutes, so members are advised not to arrive just before closing. A damaged item is removed from circulation until a qualified person has examined it.", "Before borrowing any powered tool for the first time, a member must attend a short safety session. Experienced users sometimes ask to skip this requirement, but the rule applies to everyone. Staff explain the equipment's controls and provide written instructions. If a tool behaves unusually at home, the borrower should stop using it and contact the library. Members are not expected to repair faulty electrical equipment themselves. Volunteers can offer general project advice, but the library makes clear that a demonstration is not a professional qualification.", "The first three months produced encouraging results. Tools were borrowed 280 times, and several residents reported completing jobs they had postponed for years. Yet the coordinator resisted describing every loan as a purchase prevented. Some borrowers would otherwise have borrowed from a friend; others tried an activity only because the tool was available. Loan totals showed that the service was being used, but they could not reveal exactly how much money or material it had saved. A short follow-up survey was introduced to explore those questions.", "The library is now considering donations to expand the collection. It will accept only items that meet its safety and maintenance requirements, rather than every tool offered by the public. Storage space and volunteer time are limited. The coordinator would prefer twenty reliable, frequently used tools to a hundred machines that are difficult to maintain. For the pilot's final review, staff will examine repair costs, waiting times and users' experiences. A longer catalogue alone will not be treated as evidence of a better service."], "words": 512}, {"title": "Choosing Working Hours", "paragraphs": ["A small translation company recently tested a new working arrangement. Employees could begin between seven and ten in the morning, provided they completed their usual hours and were available for a shared meeting from eleven to twelve. The company was not reducing the working week. It was changing when people worked, rather than how much work they were expected to do. Managers hoped this flexibility would help employees manage travel and family responsibilities while preserving enough common time for cooperation.", "Before the trial, most employees began at nine. Several spent a large part of their journey in crowded buses, while others struggled to arrive after taking children to school. Under the new system, an employee could choose an earlier journey or begin after the school run. However, colleagues did not always select the same schedule each day. To avoid confusion, everyone entered the next day's starting time in a shared calendar before leaving work. Urgent client requests still had to be covered throughout the normal business day.", "For eight weeks, managers recorded completed projects, missed deadlines and requests for corrections. They compared these records with those from the preceding eight weeks. The total number of projects completed rose slightly, while missed deadlines became less common. Employees also reported greater satisfaction with their journeys. These findings were useful, but the trial did not isolate the effect of flexible hours. A faster computer system had been introduced at nearly the same time, and the later period included fewer unusually complex assignments.", "The shared meeting initially caused unexpected difficulties. Staff began saving minor questions for that hour, making the meetings longer and leaving less time for actual discussion. The team responded by creating a written question board. Routine questions could be answered there whenever someone had a spare moment, while the meeting was reserved for decisions requiring several people. This change did not remove the need to communicate. Instead, it helped the team choose an appropriate method for different kinds of communication.", "Not every job could use the arrangement in exactly the same way. Two employees responsible for a live telephone service needed to maintain continuous coverage. They could exchange early and late shifts, but they could not both choose to finish early on the same afternoon. Some office staff initially viewed this as unfair. After discussing the service requirements, the team agreed that fairness did not necessarily mean identical schedules. It meant giving people meaningful choices wherever those choices were compatible with the work.", "The company decided to continue the trial for another three months, rather than declare the policy a permanent success. Managers planned to include a busier period and to ask clients whether response times had changed. They also wanted to learn whether employees felt pressure to answer messages outside their chosen hours. A policy that appeared flexible on paper could be less helpful if it quietly extended the working day. The aim was to improve employees' control over time without making responsibility for communication unclear. Other organizations considering similar changes would need to examine their own tasks and customer needs."], "words": 511}, {"title": "Counting Birds in the City", "paragraphs": ["In the fictional city of Bellhaven, a university team wanted to understand how birds used public green spaces. Visiting every park each week would have required more time than the researchers had. They therefore invited residents to record birds during short walks and submit their observations through a website. The project combined many small contributions into a much larger collection of data. Such participation could extend scientific observation beyond the places that a professional team was able to visit regularly.", "Volunteers were asked to follow a simple procedure. Each observation period lasted fifteen minutes, and participants recorded the location, time, weather and number of birds they could identify. A guide helped them distinguish common species. They were also asked to report a walk during which they saw no birds. A zero was useful information, whereas an unreported walk could not be distinguished from a visit that never happened. People were told to mark uncertain identifications instead of selecting a species merely to complete the form.", "At first, the results appeared to show that birds were much more common near the city centre than in outer districts. The researchers did not immediately interpret this as a genuine biological pattern. Most volunteers lived near the centre, and central parks were easier to reach by public transport. The map of bird reports was therefore also a map of where people had looked. A place with few records might have few birds, or it might simply have few observers. Those possibilities required different explanations.", "To investigate, the team arranged additional visits to poorly represented areas and compared sites with similar amounts of observation. The apparent gap between the centre and outer districts became smaller. It did not disappear completely, but the original difference had exaggerated the contrast. The revised analysis suggested that habitat features, such as the presence of trees and nearby water, were more informative than distance from the city centre alone. Even so, the researchers avoided claiming that any single feature caused a particular bird population to grow.", "Training also changed the quality of the records. A few volunteers initially confused two birds with similar colours. Short identification sessions helped reduce these mistakes. Photographs were requested for unusual sightings, and experienced reviewers examined them before the reports entered the main dataset. The aim was not to reject beginners, whose contributions were valuable, but to make uncertainty visible and manageable. Researchers explained that correcting a mistaken record was a normal part of the process, rather than a reason to stop taking part.", "The project had benefits beyond the database. Participants reported noticing changes in their neighbourhoods and discussing the use of local parks. However, these personal accounts did not prove that the project had changed everyone's behaviour. People who enjoyed birds may have been more likely to join and to complete the feedback form. The team planned to repeat observations across different seasons and to recruit volunteers from less represented districts. Its conclusion was that public participation could produce valuable evidence when supported by clear procedures, careful checking and honest descriptions of what the data could not show."], "words": 515}, {"title": "Objects and Copies in a Museum", "paragraphs": ["Visitors to a small history museum recently encountered two versions of the same carved bowl. One was an original object kept behind glass; the other was a carefully made copy that visitors could hold. Some people welcomed the arrangement, while others wondered whether displaying a copy weakened the museum's purpose. The disagreement raised a broader question: what do visitors gain from an original object, and what can a reproduction add? The answers depend partly on what the museum is trying to help people understand.", "An original object connects a visitor with a particular time and place. Marks on its surface may reveal how it was made or used. Its materials can provide evidence that a reproduction cannot fully preserve. For these reasons, replacing every original with a copy would remove something important. However, protecting fragile objects often requires barriers and controlled lighting. A visitor may be unable to see the bottom of a bowl or judge its weight. Preservation makes continued study possible, but it can limit immediate physical access.", "A reproduction offers different opportunities. A visitor who handles a copy can feel its size and test how easily it can be lifted. A teacher can use it to demonstrate an action without risking damage to the original. This is particularly helpful when the skill being explained involves movement, such as pouring from a narrow opening. Yet the copy should not be presented as an exact substitute for every purpose. A modern material may have a different weight, and a reconstructed pattern may include details that are uncertain.", "Clear labels are therefore essential. In one display, the museum showed which parts of a reconstructed bowl followed surviving evidence and which parts had been inferred. [A] These two colours were repeated on the labels beside the bowl. [B] These distinctions allowed visitors to separate what was known from what was proposed. [C] Without such information, a smooth, complete object could create a misleading impression of certainty. [D] Explaining uncertainty did not necessarily make the display less interesting; it could show visitors how historical knowledge is produced.", "The museum also discovered that visitor preferences varied. Some wanted a quiet encounter with an original; others learned more through handling and discussion. Providing both experiences was more useful than assuming a single method would suit everyone. Nevertheless, interactive exhibits required cleaning, supervision and occasional replacement. Their value could not be assessed merely by counting how often someone touched them. A popular activity might attract attention without helping visitors understand the historical question it was intended to address.", "For its next exhibition, the museum planned to ask visitors to explain one thing they had learned and identify one question that remained uncertain. Staff would use those responses alongside observation and attendance figures. The aim was not to prove that originals or copies were universally better. It was to choose a combination appropriate to each object and learning goal. Authenticity and access were not always competing values: carefully described reproductions could support engagement with originals, provided the difference between historical evidence and modern interpretation remained clear."], "words": 510}], "questions": [{"id": 1, "passage": 0, "type": "Ý chính", "text": "What is the main purpose of the passage?", "options": ["To advertise a professional building company", "To explain how a new lending service works and is being evaluated", "To argue that libraries should stop lending books", "To compare every type of gardening tool"], "answer": 1, "explanation": "Toàn bài gồm mục tiêu, cách mượn, an toàn và đánh giá dịch vụ. A/C không có; D quá hẹp và không phản ánh cấu trúc bài."}, {"id": 2, "passage": 0, "type": "Chi tiết", "text": "According to paragraph 1, who was the pilot especially intended to help?", "options": ["People who needed tools only from time to time", "Companies carrying out large construction projects", "Residents who collected expensive machines", "Professional repair workers seeking qualifications"], "answer": 0, "explanation": "Đoạn 1: needed an item occasionally nhưng khó biện minh việc mua/lưu trữ. B/D nằm ngoài mục tiêu; C không được nêu."}, {"id": 3, "passage": 0, "type": "Từ vựng", "text": "The word “modest” in paragraph 1 is closest in meaning to", "options": ["dangerous", "modern", "private", "limited"], "answer": 3, "explanation": "Modest mô tả quy mô khiêm tốn, được giải thích bằng a few. Không nói nguy hiểm, riêng tư hay hiện đại."}, {"id": 4, "passage": 0, "type": "Chi tiết", "text": "When can a borrower extend a loan?", "options": ["Whenever the information desk is closed", "After purchasing another library card", "When no other person has reserved the item", "Only after borrowing it for three months"], "answer": 2, "explanation": "Đoạn 2 giới hạn gia hạn một lần khi không ai đặt trước. A/B/D thêm điều kiện không có."}, {"id": 5, "passage": 0, "type": "Mục đích", "text": "Why must tools be returned when the tool desk is staffed?", "options": ["Staff need to check parts and discuss problems", "Borrowers must pay a new fee each time", "The tools can only be carried during daylight", "The library no longer has a book-return box"], "answer": 0, "explanation": "Đoạn 3 nêu mục đích kiểm tra đủ bộ phận và trao đổi vấn đề. B không có; C không được function answerMap(input,range){const out={};if(!input||typeof input!=='object')return out;for(const id of range){const v=input[id];if(Number.isInteger(v)&&v>=0&&v<4)out[id]=v;}return out;}
function grade(range,answers){return range.reduce((a,id)=>{const q=DATA.questions[id-1];if(answers[id]===q.answer)a.correct++;else if(answers[id]===undefined)a.unanswered++;else a.wrong++;return a;},{correct:0,wrong:0,unanswered:0,total:range.length});}
function cleanSession(s){
 if(!s||!['exam','practice'].includes(s.mode)||!Number.isFinite(s.start)||s.start<=0)return null;
 const passage=Number.isInteger(s.passage)&&s.passage>=0&&s.passage<4?s.passage:0;
 const range=s.mode==='exam'?DATA.questions.map(q=>q.id):DATA.questions.filter(q=>q.passage===passage).map(q=>q.id);
 const end=s.mode==='exam'?s.start+3600000:null;
 return {id:String(s.id||uid()).slice(0,80),mode:s.mode,start:s.start,end,passage,range,answers:answerMap(s.answers,range),flags:Array.isArray(s.flags)?s.flags.filter(id=>range.includes(id)):[]};
}
function cleanState(s){
 if(!s||typeof s!=='object'||s.version!==1)throw Error('Bản sao không đúng định dạng Reading Studio.');
 const v=emptyState();
 if(s.vocab&&typeof s.vocab==='object')for(const id of validVocab)if(['known','learning'].includes(s.vocab[id]))v.vocab[id]=s.vocab[id];
 for(const [key,set] of [['stars',validVocab],['lessons',new Set(DATA.lessons.map(l=>l.id))],['tasks',taskIds],['resolved',qids]])if(Array.isArray(s[key]))v[key]=[...new Set(s[key].filter(x=>set.has(x)))];
 if(s.daily&&typeof s.daily==='object')for(const [key,ids] of Object.entries(s.daily).slice(-400))if(/^\d{4}-\d{2}-\d{2}$/.test(key)&&Array.isArray(ids))v.daily[key]=[...new Set(ids.filter(id=>validVocab.has(id)))];
 if(s.notes&&typeof s.notes==='object')for(let i=1;i<=10;i++)if(typeof s.notes[i]==='string')v.notes[i]=s.notes[i].slice(0,30000);
 if(Array.isArray(s.journal))v.journal=s.journal.slice(0,200).filter(n=>n&&typeof n.body==='string').map(n=>({id:String(n.id||uid()).slice(0,80),title:String(n.title||'Ghi chú').slice(0,180),body:n.body.slice(0,30000),date:Number.isFinite(n.date)?n.date:Date.now()}));
 if(Array.isArray(s.attempts))for(const a of s.attempts.slice(-200)){
  if(!a||!['exam','practice'].includes(a.mode)||!Array.isArray(a.range))continue;
  const range=[...new Set(a.range.filter(id=>qids.has(id)))];if(!range.length)continue;
  const answers=answerMap(a.answers,range);v.attempts.push({id:String(a.id||uid()).slice(0,80),date:Number.isFinite(a.date)?a.date:Date.now(),mode:a.mode,range,answers,ms:Number.isFinite(a.ms)?Math.max(0,a.ms):0,score:grade(range,answers).correct});
 }
 v.lastAttempt=v.attempts.some(a=>a.id===s.lastAttempt)?s.lastAttempt:v.attempts.at(-1)?.id||null;
 v.session=cleanSession(s.session);v.theme=s.theme==='dark'?'dark':'light';v.font=[16,18,20,22,24].includes(s.font)?s.font:18;v.lastGuide=Number.isInteger(s.lastGuide)&&s.lastGuide>=1&&s.lastGuide<=10?s.lastGuide:3;
 return v;
}
function filteredWords(data,progress,filters){return data.vocab.filter(w=>{
 const group=data.groups[w.group];
 if(filters.group!=='all'&&w.group!==Number(filters.group))return false;
 if(filters.source!=='all'&&group.kind!==filters.source)return false;
 if(filters.status==='known'&&progress.vocab[w.id]!=='known')return false;
 if(filters.status==='learning'&&progress.vocab[w.id]==='known')return false;
 if(filters.status==='starred'&&!progress.stars.includes(w.id))return false;
 if(filters.search&&!normalise([w.term,w.meaning,w.synonym,w.antonym].join(' ')).includes(normalise(filters.search)))return false;
 return true;
});}

function reading(){

function sessionView(){

bel="Tăng cỡ chữ bài đọc">A+</button></div></div><div class="passage-body" lang="en">${p.paragraphs.map((p,i)=>`<p><span class="paragraph-index" aria-label="Đoạn ${i+1}">${i+1}</span>${esc(p)}</p>`).join('')}</div></section><section class="reading-panel question-panel" aria-label="Câu hỏi"><div class="reading-panel-head"><h3>CÂU ${questions[0].id}–${questions.at(-1).id}</h3><span class="muted small">Chọn một đáp án</span></div><div class="questions-body">${questions.map(q=>`<fieldset class="question" id="q-${q.id}"><legend lang="en">${q.id}. ${esc(q.text)}</legend><div class="q-meta"><span class="type">${s.mode==='practice'?q.type:'Câu '+q.id}</span><button class="flag ${s.flags.includes(q.id)?'active':''}" data-action="flag" data-id="${q.id}" aria-pressed="${s.flags.includes(q.id)}">${icon('flag')} ${s.flags.includes(q.id)?'Đã đánh dấu':'Xem lại'}</button></div>${q.options.map((op,i)=>`<label class="option ${s.answers[q.id]===i?'chosen':''}"><input type="radio" name="q${q.id}" value="${i}" data-question="${q.id}" ${s.answers[q.id]===i?'checked':''}><span lang="en"><b>${letters[i]}.</b> ${esc(op)}</span></label>`).join('')}</fieldset>`).join('')}</div></section></div><div class="session-foot"><span class="muted small">${s.mode==='exam'?'Đồng hồ tiếp tục khi bạn đổi mục hoặc đóng trang.':'Bài làm tự lưu. Lời giải mở sau khi nộp bài.'}</span>${s.mode==='exam'&&s.passage<3?btn('Bài tiếp '+icon('arrow'),'passage',`data-id="${s.passage+1}"`,'secondary'):''}${btn('Nộp bài & xem kết quả','submit')}</div>`;
}
function timeText(){if(!state.session)return '';const s=state.session;const sec=Math.max(0,Math.floor((s.mode==='exam'?s.end-Date.now():Date.now()-s.start)/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function start(mode,passage=0){const range=mode==='exam'?DATA.questions.map(q=>q.id):DATA.questions.filter(q=>q.passage===passage).map(q=>q.id);state.session={id:uid(),mode,start:Date.now(),end:mode==='exam'?Date.now()+3600000:null,passage,range,answers:{},flags:[]};mobileReading='text';save();nav('reading');}
function finish(auto=false){
 const s=state.session;if(!s)return;const g=grade(s.range,s.answers);const a={id:s.id,date:Date.now(),mode:s.mode,range:[...s.range],answers:{...s.answers},ms:Math.max(0,(auto?s.end:Date.now())-s.start),score:g.correct};
 state.attempts.push(a);if(state.attempts.length>200)state.attempts.shift();state.lastAttempt=a.id;state.session=null;state.resolved=state.resolved.filter(id=>!a.range.includes(id)||a.answers[id]===DATA.questions[id-1].answer);save();resultFilter='all';closeModal();nav('reading/result');if(auto)toast('Hết 60 phút. Bài đã được nộp và lưu tự động.');
}
function reviewQuestion(q,chosen,inNotebook=false){

}
function resultView(a){
 if(!a)return `<div class="empty">${icon('pen')}<h3>Chưa có bài đã nộp</h3><p>Làm một bài Reading để xem điểm và giải thích tại đây.</p>${routeLink('Mở bài luyện','reading')}</div>`;
 const g=grade(a.range,a.answers),percent=pct(g.correct,g.total),qs=DATA.questions.filter(q=>a.range.includes(q.id)&&(resultFilter!=='wrong'||a.answers[q.id]!==q.answer));
 const summary=DATA.passages.map((p,i)=>{const range=a.range.filter(id=>DATA.questions[id-1].passage===i);if(!range.length)return '';const sub=grade(range,a.answers);return `<div class="card"><h4>Bài ${i+1}</h4><b>${sub.correct}<small class="muted"> / ${sub.total}</small></b><div class="progress" style="margin-top:12px"><span style="width:${pct(sub.correct,sub.total)}%"></span></div></div>`;}).join('');

function plan(){return head('Sáu tuần, từng việc cụ thể.','Đánh dấu việc đã làm và điều chỉnh tốc độ theo nền tảng của mình.','LỘ TRÌNH TỰ HỌC')+`<div class="card"><div class="flex between wrap"><h3>Tiến độ kế hoạch</h3><span class="chip">${state.tasks.length} / 18 việc</span></div><div class="progress" style="margin:18px 0"><span style="width:${pct(state.tasks.length,18)}%"></span></div><p class="muted small">Gợi ý 60 phút Reading mỗi ngày, 5–6 ngày/tuần. Sáu tuần là cách phân bổ việc học, không phải cam kết đạt B1.</p></div><div class="weeks">${DATA.weeks.map((w,i)=>`<section class="card week"><div class="flex between"><div class="eyebrow">TUẦN 0${i+1}</div><span class="chip gray">${w.tasks.filter((_,j)=>state.tasks.includes(`${i}-${j}`)).length}/3</span></div><h3>${w.name}</h3><p>${w.text}</p>${w.tasks.map((t,j)=>{const id=`${i}-${j}`;return `<label class="task ${state.tasks.includes(id)?'done':''}"><input type="checkbox" data-task="${id}" ${state.tasks.includes(id)?'checked':''}><span>${t}</span></label>`;}).join('')}</section>`).join('')}</div><div class="subsection">${notice('<strong>Buổi không làm đề đủ giờ:</strong> 10 phút ôn từ cũ → 15 phút học một dạng → 20 phút làm bài → 15 phút chữa. Ngày thi thử, dành trọn 60 phút làm bài và bố trí buổi khác để chữa.')}</div>`;}

    if(a.dataset.wp==='close')closePop();
    else if(a.dataset.wp==='say')say(v.term,a);
    else if(a.dataset.wp==='save'){
      const on=!state.stars.includes(id);state.stars=on?[...state.stars,id]:state.stars.filter(x=>x!==id);save();
      a.setAttribute('aria-pressed',String(on));a.querySelector('span').textContent=on?'Đã lưu vào thẻ ôn':'Lưu vào thẻ ôn';
      qa(`.vw[data-v="${id}"]`).forEach(x=>x.classList.toggle('saved',on));
      toast(on?`Đã lưu “${v.term}” vào nhóm Đã đánh dấu sao trong Từ vựng.`:`Đã bỏ “${v.term}” khỏi thẻ ôn.`);
    }
    return;
  }
  if(!pop.contains(e.target)){closePop(false);if(e.target.closest('.passage-body')){e.stopPropagation();e.preventDefault();}}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pop){e.stopPropagation();e.preventDefault();closePop();}},true);
window.addEventListener('resize',()=>closePop(false));
document.addEventListener('scroll',e=>{if(pop&&window.innerWidth>700)closePop(false);},true);
if(canSpeak&&speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>{};


/* ---- Pronunciation in the Vocab tab ---- */
const AUTO_KEY='amy-vstep-autosay';let lastAuto=null;
const autoOn=()=>{try{return localStorage.getItem(AUTO_KEY)==='1';}catch(e){return false;}};
function sayBtn(id,small){const v=DATA.vocab[id];return `<button type="button" class="say-btn" data-say="${id}" aria-label="Nghe phát âm ${esc(v.term)}" title="Nghe phát âm">${speakerSVG}</button>`;}
function vocabSpeak(){
  if(!canSpeak||view!=='vocab')return;
  qa('.flash-face').forEach(face=>{
    const top=face.querySelector('.flash-top'),star=top&&top.querySelector('[data-action=star]');
    if(!star||top.querySelector('.say-btn'))return;
    const wrap=document.createElement('div');wrap.className='ft-actions';star.replaceWith(wrap);
    wrap.insertAdjacentHTML('beforeend',sayBtn(+star.dataset.id));wrap.appendChild(star);
  });
  qa('.vocab-table [data-action=star]').forEach(star=>{
    if(star.parentElement.querySelector('.say-btn'))return;
    star.insertAdjacentHTML('afterend',sayBtn(+star.dataset.id,true));
  });
  const nav=q('.flash-nav');
  if(nav&&!nav.querySelector('.autosay')){
    const shuffle=nav.querySelector('[data-action=shuffle]');
    const right=document.createElement('div');right.className='nav-right';
    const on=autoOn();
    right.innerHTML=`<button type="button" class="autosay" data-autosay aria-pressed="${on}" title="Tự đọc từ khi chuyển thẻ">${speakerSVG}Tự đọc</button>`;
    if(shuffle){shuffle.replaceWith(right);right.appendChild(shuffle);}else nav.appendChild(right);
  }
  /* auto-read only when the card actually changes, never on star/flip re-renders */
  const front=q('.flash-face.front [data-say]');
  const cur=front?+front.dataset.say:null;
  if(cur!==null&&cur!==lastAuto){const prev=lastAuto;lastAuto=cur;if(prev!==null&&autoOn())say(DATA.vocab[cur].term,front);}
  if(cur===null)lastAuto=null;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(b){e.preventDefault();e.stopPropagation();const v=DATA.vocab[+b.dataset.say];if(v)say(v.term,b);return;}
  const t=e.target.closest('[data-autosay]');
  if(t){const on=t.getAttribute('aria-pressed')!=='true';try{localStorage.setItem(AUTO_KEY,on?'1':'0');}catch(err){}
    t.setAttribute('aria-pressed',String(on));toast(on?'Đã bật tự đọc: mỗi lần chuyển thẻ sẽ đọc từ mới.':'Đã tắt tự đọc.');
    if(on){const f=q('.flash-face.front [data-say]');if(f)say(DATA.vocab[+f.dataset.say].term,f);}}
},true);

/* review modal after submit: lookups open, nothing locked */
const _sp=actions.showPassage;
actions.showPassage=function(d){_sp.call(this,d);linkWords(q('#modal .passage-body'),null);};

const _render=render;
render=function(){closePop(false);_render();linkSession();vocabSpeak();};
linkSession();vocabSpeak();
})();
</script></body></html>
