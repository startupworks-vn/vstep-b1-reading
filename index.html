ppose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>oppose (v)\u003c/td>\u003ctd>phản đối\u003c/td>\u003ctd>be against\u003c/td>\u003ctd>support\u003c/td>\u003c/tr>\u003ctr>\u003ctd>despite (prep)\u003c/td>\u003ctd>mặc dù, bất chấp\u003c/td>\u003ctd>in spite of\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>therefore (adv)\u003c/td>\u003ctd>vì vậy\u003c/td>\u003ctd>consequently\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>whereas (conj)\u003c/td>\u003ctd>trong khi dùng để đối chiếu\u003c/td>\u003ctd>while in contrast\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The policy is likely to help, but success is not guaranteed. → Chính sách có khả năng hữu ích nhưng chưa chắc thành công.\u003c/p>\n\u003ch3>5.3 Họ từ và cụm từ giúp nhận ra paraphrase\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Họ từ hoặc cấu trúc\u003c/th>\u003cth>Cách nhận ra trong Reading\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>develop → development → developed → developing\u003c/td>\u003ctd>develop a skill; economic development; developing countries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>educate → education → educational → educated\u003c/td>\u003ctd>education policy; educational opportunities\u003c/td>\u003c/tr>\u003ctr>\u003ctd>compete → competition → competitive → competitor\u003c/td>\u003ctd>competitive prices; a strong competitor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>protect → protection → protective\u003c/td>\u003ctd>protect the environment; environmental protection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pollute → pollution → polluted → pollutant\u003c/td>\u003ctd>air pollution; polluted water; pollutants in the air\u003c/td>\u003c/tr>\u003ctr>\u003ctd>produce → production → productive → productivity\u003c/td>\u003ctd>production increases; improve productivity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>rely → reliable → reliability\u003c/td>\u003ctd>rely on data; reliable evidence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>benefit → beneficial\u003c/td>\u003ctd>benefit residents; be beneficial to residents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depend on ↔ be determined by\u003c/td>\u003ctd>The result depends on X ↔ X determines the result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lead to ↔ result in ↔ cause\u003c/td>\u003ctd>A causes B; không đảo thành B causes A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>result from ↔ be caused by\u003c/td>\u003ctd>B results from A; chú ý chiều nguyên nhân\u003c/td>\u003c/tr>\u003ctr>\u003ctd>prevent A from doing B\u003c/td>\u003ctd>ngăn A làm B, khác allow/enable A to do B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>be responsible for ↔ account for\u003c/td>\u003ctd>có thể tương đương khi nói nguyên nhân/tỷ trọng, cần ngữ cảnh\u003c/td>\u003c/tr>\u003ctr>\u003ctd>take part in ↔ participate in\u003c/td>\u003ctd>tham gia một hoạt động\u003c/td>\u003c/tr>\u003ctr>\u003ctd>make use of ↔ use\u003c/td>\u003ctd>sử dụng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>in contrast to ↔ unlike\u003c/td>\u003ctd>tạo quan hệ đối lập\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>5.4 Những cặp dễ học sai\u003c/h3>\n\u003cp>\u003cstrong>Effective và efficient:\u003c/strong> effective là tạo ra kết quả mong muốn; efficient là sử dụng thời gian/nguồn lực ít lãng phí. Một phương pháp có thể effective nhưng không efficient. \u003cstrong>Economic và economical:\u003c/strong> economic liên quan kinh tế; economical tiết kiệm. \u003cstrong>Principal và principle:\u003c/strong> principal có thể là tính từ “chính”; principle là danh từ “nguyên tắc”.\u003c/p>\n\u003cp>\u003cstrong>Rise và raise:\u003c/strong> prices rise; companies raise prices. \u003cstrong>Affect và effect:\u003c/strong> affect thường là động từ tác động; effect thường là danh từ kết quả/tác động. \u003cstrong>Borrow và lend:\u003c/strong> borrow from; lend to. \u003cstrong>Few và a few:\u003c/strong> few nhấn mạnh rất ít, thường không đủ; a few nhấn mạnh có một vài. \u003cstrong>Most và almost:\u003c/strong> most students = đa số sinh viên; almost all students = gần như tất cả; không dùng almost students theo nghĩa đó.\u003c/p>\n\u003cp>\u003cstrong>Imply và infer:\u003c/strong> tác giả implies một điều; người đọc infers điều đó từ bằng chứng. \u003cstrong>Claim và prove:\u003c/strong> claim chỉ nêu một khẳng định, chưa đồng nghĩa đã chứng minh. \u003cstrong>Correlated with và caused by:\u003c/strong> đi cùng nhau không tự động là quan hệ nguyên nhân.\u003c/p>\n\u003ch3>5.5 Cách học để dùng được trong bài đọc\u003c/h3>\n\u003cp>Mỗi ngày chọn 8–10 mục, ưu tiên từ xuất hiện lại trong bài bạn đang làm. Với mỗi từ, ghi nghĩa trong câu, một cụm đi kèm và một cách diễn đạt tương đương. Không chép mười nghĩa từ điển cho một từ.\u003c/p>\n\u003cp>Ví dụ thẻ: mặt trước “The policy may reduce costs. Reduce = ?”; mặt sau “cut/decrease; làm giảm; reduce costs; trái nghĩa increase/raise trong ngữ cảnh này”. Thẻ thứ hai đổi chiều: “Cut costs = r___ costs”. Tạo thêm một câu chọn synonym trong bốn phương án để kiểm tra nhận diện.\u003c/p>\n\u003cp>Lịch ôn gợi ý: ngày học → hôm sau → sau 3 ngày → 7 ngày → 14 ngày. Đến buổi ôn, che nghĩa và tự nhớ lại trước khi xem. Nếu sai, đưa từ về lần ôn gần hơn. Mỗi tuần đọc lại một bài có những từ đã học để kiểm tra xem bạn có nhận ra chúng trong câu mới không.\u003c/p>\n\u003cp>Không cần học thuộc mọi tên riêng, tên chất hay tên chòm sao. Ưu tiên từ làm thay đổi logic và đáp án như only, rarely, whereas, evidence, significant, decrease. Với thuật ngữ lạ, tập tìm định nghĩa ngay trong bài trước.\u003c/p>"}, {"id": 6, "title": "Đề luyện Reading tự biên soạn", "html": "\u003cp>\u003cstrong>Thời gian 60 phút. Bốn bài đọc, mỗi bài 10 câu. Chọn một đáp án A, B, C hoặc D.\u003c/strong> Làm không dùng từ điển và không xem phần đáp án trước. Tổng độ dài bốn văn bản khoảng 2048 từ, không tính câu hỏi.\u003c/p>\n\u003cp>Đề này mô phỏng cấu trúc và độ dài Reading VSTEP.3–5 để luyện kỹ thuật ở mức B1 hướng tới B2; chưa được thử nghiệm, chuẩn hóa hoặc quy đổi sang điểm thi. Các tổ chức, chương trình và số liệu trong tình huống là nội dung tự biên soạn để luyện đọc, không phải tin tức hay báo cáo nghiên cứu thực tế.\u003c/p>\n\u003cp>Ngày làm: __________  Bắt đầu: __________  Kết thúc: __________  Số câu đúng sau khi chấm: ____/40.\u003c/p>\n\u003ch3>Passage 1 Riverside Library\u003c/h3>\n\u003cp>\u003cstrong>Đoạn 1.\u003c/strong> When Riverside Library announced that it would lend tools as well as books, some residents imagined shelves full of expensive machines. The actual collection was modest: a few drills, sewing machines, gardening tools and equipment for measuring rooms. The six-month pilot was designed for people who needed an item occasionally but could not justify buying or storing it. The library wanted to make everyday projects easier, especially for residents living in small apartments. It did not intend to replace professional repair services or supply equipment for commercial building work.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 2.\u003c/strong> Adults living in the district can borrow tools after showing a library card and proof of address. There is no additional membership fee. Each person may borrow two items at a time, normally for seven days. A loan can be extended once, but only if nobody else has reserved the item. Reservations may be made online or at the information desk. People without internet access therefore have the same opportunity to join the waiting list, although staff cannot promise that a popular item will be immediately available.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 3.\u003c/strong> Borrowers must return equipment while the tool desk is staffed. The ordinary book-return box cannot be used, and leaving a machine outside the building does not count as returning it. This rule allows staff to check whether all the parts are present and to discuss any problems with the borrower. The checks take a few minutes, so members are advised not to arrive just before closing. A damaged item is removed from circulation until a qualified person has examined it.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 4.\u003c/strong> Before borrowing any powered tool for the first time, a member must attend a short safety session. Experienced users sometimes ask to skip this requirement, but the rule applies to everyone. Staff explain the equipment&#x27;s controls and provide written instructions. If a tool behaves unusually at home, the borrower should stop using it and contact the library. Members are not expected to repair faulty electrical equipment themselves. Volunteers can offer general project advice, but the library makes clear that a demonstration is not a professional qualification.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 5.\u003c/strong> The first three months produced encouraging results. Tools were borrowed 280 times, and several residents reported completing jobs they had postponed for years. Yet the coordinator resisted describing every loan as a purchase prevented. Some borrowers would otherwise have borrowed from a friend; others tried an activity only because the tool was available. Loan totals showed that the service was being used, but they could not reveal exactly how much money or material it had saved. A short follow-up survey was introduced to explore those questions.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 6.\u003c/strong> The library is now considering donations to expand the collection. It will accept only items that meet its safety and maintenance requirements, rather than every tool offered by the public. Storage space and volunteer time are limited. The coordinator would prefer twenty reliable, frequently used tools to a hundred machines that are difficult to maintain. For the pilot&#x27;s final review, staff will examine repair costs, waiting times and users&#x27; experiences. A longer catalogue alone will not be treated as evidence of a better service.\u003c/p>\n\u003cp>\u003cstrong>1. What is the main purpose of the passage?\u003c/strong>\u003c/p>\n\u003cp>A. To advertise a professional building company\u003c/p>\n\u003cp>B. To explain how a new lending service works and is being evaluated\u003c/p>\n\u003cp>C. To argue that libraries should stop lending books\u003c/p>\n\u003cp>D. To compare every type of gardening tool\u003c/p>\n\u003cp>\u003cstrong>2. According to paragraph 1, who was the pilot especially intended to help?\u003c/strong>\u003c/p>\n\u003cp>A. People who needed tools only from time to time\u003c/p>\n\u003cp>B. Companies carrying out large construction projects\u003c/p>\n\u003cp>C. Residents who collected expensive machines\u003c/p>\n\u003cp>D. Professional repair workers seeking qualifications\u003c/p>\n\u003cp>\u003cstrong>3. The word “modest” in paragraph 1 is closest in meaning to\u003c/strong>\u003c/p>\n\u003cp>A. dangerous\u003c/p>\n\u003cp>B. modern\u003c/p>\n\u003cp>C. private\u003c/p>\n\u003cp>D. limited\u003c/p>\n\u003cp>\u003cstrong>4. When can a borrower extend a loan?\u003c/strong>\u003c/p>\n\u003cp>A. Whenever the information desk is closed\u003c/p>\n\u003cp>B. After purchasing another library card\u003c/p>\n\u003cp>C. When no other person has reserved the item\u003c/p>\n\u003cp>D. Only after borrowing it for three months\u003c/p>\n\u003cp>\u003cstrong>5. Why must tools be returned when the tool desk is staffed?\u003c/strong>\u003c/p>\n\u003cp>A. Staff need to check parts and discuss problems\u003c/p>\n\u003cp>B. Borrowers must pay a new fee each time\u003c/p>\n\u003cp>C. The tools can only be carried during daylight\u003c/p>\n\u003cp>D. The library no longer has a book-return box\u003c/p>\n\u003cp>\u003cstrong>6. Which of the following is NOT permitted?\u003c/strong>\u003c/p>\n\u003cp>A. Making a reservation at the desk\u003c/p>\n\u003cp>B. Borrowing two items at once\u003c/p>\n\u003cp>C. Stopping use when a tool behaves unusually\u003c/p>\n\u003cp>D. Skipping the first safety session because one is experienced\u003c/p>\n\u003cp>\u003cstrong>7. In paragraph 3, “it” in “has examined it” refers to\u003c/strong>\u003c/p>\n\u003cp>A. the return box\u003c/p>\n\u003cp>B. the damaged item\u003c/p>\n\u003cp>C. the information desk\u003c/p>\n\u003cp>D. the written instruction\u003c/p>\n\u003cp>\u003cstrong>8. What does paragraph 5 suggest about the 280 loans?\u003c/strong>\u003c/p>\n\u003cp>A. Every loan replaced the purchase of a new tool\u003c/p>\n\u003cp>B. They prove that all residents saved equal amounts\u003c/p>\n\u003cp>C. They show use of the service but not its exact savings\u003c/p>\n\u003cp>D. Most of them were made by professional builders\u003c/p>\n\u003cp>\u003cstrong>9. Which statement best expresses the coordinator’s preference in paragraph 6?\u003c/strong>\u003c/p>\n\u003cp>A. A small useful collection is better than a large collection that is hard to maintain\u003c/p>\n\u003cp>B. All donated machines should be accepted immediately\u003c/p>\n\u003cp>C. The number of machines matters more than their condition\u003c/p>\n\u003cp>D. Volunteers should spend no time checking equipment\u003c/p>\n\u003cp>\u003cstrong>10. What is the author’s overall attitude toward the pilot?\u003c/strong>\u003c/p>\n\u003cp>A. Completely dismissive\u003c/p>\n\u003cp>B. Certain that it has solved all local repair problems\u003c/p>\n\u003cp>C. Angry about public libraries\u003c/p>\n\u003cp>D. Generally positive while acknowledging limits\u003c/p>\n\u003ch3>Passage 2 Choosing Working Hours\u003c/h3>\n\u003cp>\u003cstrong>Đoạn 1.\u003c/strong> A small translation company recently tested a new working arrangement. Employees could begin between seven and ten in the morning, provided they completed their usual hours and were available for a shared meeting from eleven to twelve. The company was not reducing the working week. It was changing when people worked, rather than how much work they were expected to do. Managers hoped this flexibility would help employees manage travel and family responsibilities while preserving enough common time for cooperation.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 2.\u003c/strong> Before the trial, most employees began at nine. Several spent a large part of their journey in crowded buses, while others struggled to arrive after taking children to school. Under the new system, an employee could choose an earlier journey or begin after the school run. However, colleagues did not always select the same schedule each day. To avoid confusion, everyone entered the next day&#x27;s starting time in a shared calendar before leaving work. Urgent client requests still had to be covered throughout the normal business day.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 3.\u003c/strong> For eight weeks, managers recorded completed projects, missed deadlines and requests for corrections. They compared these records with those from the preceding eight weeks. The total number of projects completed rose slightly, while missed deadlines became less common. Employees also reported greater satisfaction with their journeys. These findings were useful, but the trial did not isolate the effect of flexible hours. A faster computer system had been introduced at nearly the same time, and the later period included fewer unusually complex assignments.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 4.\u003c/strong> The shared meeting initially caused unexpected difficulties. Staff began saving minor questions for that hour, making the meetings longer and leaving less time for actual discussion. The team responded by creating a written question board. Routine questions could be answered there whenever someone had a spare moment, while the meeting was reserved for decisions requiring several people. This change did not remove the need to communicate. Instead, it helped the team choose an appropriate method for different kinds of communication.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 5.\u003c/strong> Not every job could use the arrangement in exactly the same way. Two employees responsible for a live telephone service needed to maintain continuous coverage. They could exchange early and late shifts, but they could not both choose to finish early on the same afternoon. Some office staff initially viewed this as unfair. After discussing the service requirements, the team agreed that fairness did not necessarily mean identical schedules. It meant giving people meaningful choices wherever those choices were compatible with the work.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 6.\u003c/strong> The company decided to continue the trial for another three months, rather than declare the policy a permanent success. Managers planned to include a busier period and to ask clients whether response times had changed. They also wanted to learn whether employees felt pressure to answer messages outside their chosen hours. A policy that appeared flexible on paper could be less helpful if it quietly extended the working day. The aim was to improve employees&#x27; control over time without making responsibility for communication unclear. Other organizations considering similar changes would need to examine their own tasks and customer needs.\u003c/p>\n\u003cp>\u003cstrong>11. What is the passage mainly about?\u003c/strong>\u003c/p>\n\u003cp>A. How a company replaced translators with computers\u003c/p>\n\u003cp>B. Why all workers should begin at seven\u003c/p>\n\u003cp>C. A trial of flexible hours and the issues involved\u003c/p>\n\u003cp>D. A plan to shorten every employee’s working week\u003c/p>\n\u003cp>\u003cstrong>12. What remained compulsory during the trial?\u003c/strong>\u003c/p>\n\u003cp>A. Starting work at nine\u003c/p>\n\u003cp>B. Being available from eleven to twelve\u003c/p>\n\u003cp>C. Taking children to school\u003c/p>\n\u003cp>D. Working on a telephone service\u003c/p>\n\u003cp>\u003cstrong>13. The word “preceding” in paragraph 3 is closest in meaning to\u003c/strong>\u003c/p>\n\u003cp>A. previous\u003c/p>\n\u003cp>B. following\u003c/p>\n\u003cp>C. busiest\u003c/p>\n\u003cp>D. shortest\u003c/p>\n\u003cp>\u003cstrong>14. Why did employees enter their starting times in a calendar?\u003c/strong>\u003c/p>\n\u003cp>A. To request a reduction in salary\u003c/p>\n\u003cp>B. To record the age of their children\u003c/p>\n\u003cp>C. To avoid attending any meetings\u003c/p>\n\u003cp>D. To help colleagues know when they would be available\u003c/p>\n\u003cp>\u003cstrong>15. Which change was NOT reported as a result during the eight-week period?\u003c/strong>\u003c/p>\n\u003cp>A. Slightly more completed projects\u003c/p>\n\u003cp>B. Fewer missed deadlines\u003c/p>\n\u003cp>C. Fewer total working hours required\u003c/p>\n\u003cp>D. Greater satisfaction with journeys\u003c/p>\n\u003cp>\u003cstrong>16. Why is the new computer system mentioned?\u003c/strong>\u003c/p>\n\u003cp>A. To show that another change may have influenced the results\u003c/p>\n\u003cp>B. To explain why the company stopped translating\u003c/p>\n\u003cp>C. To prove that flexible hours caused all improvements\u003c/p>\n\u003cp>D. To argue that staff no longer needed to cooperate\u003c/p>\n\u003cp>\u003cstrong>17. In paragraph 4, “there” refers to\u003c/strong>\u003c/p>\n\u003cp>A. the bus station\u003c/p>\n\u003cp>B. the shared meeting room\u003c/p>\n\u003cp>C. the client’s office\u003c/p>\n\u003cp>D. the written question board\u003c/p>\n\u003cp>\u003cstrong>18. What was the main function of the written question board?\u003c/strong>\u003c/p>\n\u003cp>A. To eliminate all team decisions\u003c/p>\n\u003cp>B. To separate routine questions from discussions needing several people\u003c/p>\n\u003cp>C. To require every employee to use the same starting time\u003c/p>\n\u003cp>D. To prevent staff from asking minor questions\u003c/p>\n\u003cp>\u003cstrong>19. What can be inferred about the telephone-service employees?\u003c/strong>\u003c/p>\n\u003cp>A. They were allowed to leave the service uncovered\u003c/p>\n\u003cp>B. They were excluded from all scheduling choices\u003c/p>\n\u003cp>C. Their choices had to fit the need for continuous service\u003c/p>\n\u003cp>D. Their work required fewer hours than other jobs\u003c/p>\n\u003cp>\u003cstrong>20. Which statement best describes the final paragraph?\u003c/strong>\u003c/p>\n\u003cp>A. The company wants further evidence before making a final judgment\u003c/p>\n\u003cp>B. The company has proved the policy works in every organization\u003c/p>\n\u003cp>C. The company plans to stop responding to clients\u003c/p>\n\u003cp>D. The company expects all employees to remain online at night\u003c/p>\n\u003ch3>Passage 3 Counting Birds in the City\u003c/h3>\n\u003cp>\u003cstrong>Đoạn 1.\u003c/strong> In the fictional city of Bellhaven, a university team wanted to understand how birds used public green spaces. Visiting every park each week would have required more time than the researchers had. They therefore invited residents to record birds during short walks and submit their observations through a website. The project combined many small contributions into a much larger collection of data. Such participation could extend scientific observation beyond the places that a professional team was able to visit regularly.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 2.\u003c/strong> Volunteers were asked to follow a simple procedure. Each observation period lasted fifteen minutes, and participants recorded the location, time, weather and number of birds they could identify. A guide helped them distinguish common species. They were also asked to report a walk during which they saw no birds. A zero was useful information, whereas an unreported walk could not be distinguished from a visit that never happened. People were told to mark uncertain identifications instead of selecting a species merely to complete the form.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 3.\u003c/strong> At first, the results appeared to show that birds were much more common near the city centre than in outer districts. The researchers did not immediately interpret this as a genuine biological pattern. Most volunteers lived near the centre, and central parks were easier to reach by public transport. The map of bird reports was therefore also a map of where people had looked. A place with few records might have few birds, or it might simply have few observers. Those possibilities required different explanations.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 4.\u003c/strong> To investigate, the team arranged additional visits to poorly represented areas and compared sites with similar amounts of observation. The apparent gap between the centre and outer districts became smaller. It did not disappear completely, but the original difference had exaggerated the contrast. The revised analysis suggested that habitat features, such as the presence of trees and nearby water, were more informative than distance from the city centre alone. Even so, the researchers avoided claiming that any single feature caused a particular bird population to grow.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 5.\u003c/strong> Training also changed the quality of the records. A few volunteers initially confused two birds with similar colours. Short identification sessions helped reduce these mistakes. Photographs were requested for unusual sightings, and experienced reviewers examined them before the reports entered the main dataset. The aim was not to reject beginners, whose contributions were valuable, but to make uncertainty visible and manageable. Researchers explained that correcting a mistaken record was a normal part of the process, rather than a reason to stop taking part.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 6.\u003c/strong> The project had benefits beyond the database. Participants reported noticing changes in their neighbourhoods and discussing the use of local parks. However, these personal accounts did not prove that the project had changed everyone&#x27;s behaviour. People who enjoyed birds may have been more likely to join and to complete the feedback form. The team planned to repeat observations across different seasons and to recruit volunteers from less represented districts. Its conclusion was that public participation could produce valuable evidence when supported by clear procedures, careful checking and honest descriptions of what the data could not show.\u003c/p>\n\u003cp>\u003cstrong>21. Why did the researchers invite residents to participate?\u003c/strong>\u003c/p>\n\u003cp>A. To avoid checking any records\u003c/p>\n\u003cp>B. To replace all public parks\u003c/p>\n\u003cp>C. To increase the range of observations they could collect\u003c/p>\n\u003cp>D. To prove that birds preferred the city centre\u003c/p>\n\u003cp>\u003cstrong>22. Why were volunteers asked to record walks with no birds?\u003c/strong>\u003c/p>\n\u003cp>A. Such walks were more enjoyable\u003c/p>\n\u003cp>B. Zero observations could be distinguished from missing reports\u003c/p>\n\u003cp>C. The researchers wanted only empty parks\u003c/p>\n\u003cp>D. Participants were paid for every zero\u003c/p>\n\u003cp>\u003cstrong>23. What does “genuine” in paragraph 3 most nearly mean?\u003c/strong>\u003c/p>\n\u003cp>A. temporary\u003c/p>\n\u003cp>B. popular\u003c/p>\n\u003cp>C. simple\u003c/p>\n\u003cp>D. real\u003c/p>\n\u003cp>\u003cstrong>24. What problem affected the original map?\u003c/strong>\u003c/p>\n\u003cp>A. Observation effort was uneven across the city\u003c/p>\n\u003cp>B. All volunteers recorded the wrong date\u003c/p>\n\u003cp>C. No central parks were accessible\u003c/p>\n\u003cp>D. The website accepted only unusual birds\u003c/p>\n\u003cp>\u003cstrong>25. What happened after additional visits were included?\u003c/strong>\u003c/p>\n\u003cp>A. The outer districts were removed from the project\u003c/p>\n\u003cp>B. All habitat differences disappeared\u003c/p>\n\u003cp>C. The apparent difference between areas became smaller\u003c/p>\n\u003cp>D. The researchers stopped comparing parks\u003c/p>\n\u003cp>\u003cstrong>26. Which statement best paraphrases the last two sentences of paragraph 3?\u003c/strong>\u003c/p>\n\u003cp>A. Few reports always mean few birds\u003c/p>\n\u003cp>B. A lack of records can reflect either fewer birds or fewer people observing\u003c/p>\n\u003cp>C. Every park has the same number of birds\u003c/p>\n\u003cp>D. The number of volunteers is unrelated to the records\u003c/p>\n\u003cp>\u003cstrong>27. In paragraph 5, “them” in “reviewers examined them” refers to\u003c/strong>\u003c/p>\n\u003cp>A. beginners\u003c/p>\n\u003cp>B. identification sessions\u003c/p>\n\u003cp>C. colours\u003c/p>\n\u003cp>D. photographs\u003c/p>\n\u003cp>\u003cstrong>28. Which of the following was NOT part of the procedure described?\u003c/strong>\u003c/p>\n\u003cp>A. Training volunteers to identify birds\u003c/p>\n\u003cp>B. Checking photographs of unusual sightings\u003c/p>\n\u003cp>C. Requiring volunteers to choose a species even when uncertain\u003c/p>\n\u003cp>D. Recording the weather during observation\u003c/p>\n\u003cp>\u003cstrong>29. What can be inferred about the feedback forms?\u003c/strong>\u003c/p>\n\u003cp>A. Responses may not represent all residents equally\u003c/p>\n\u003cp>B. Every resident completed one\u003c/p>\n\u003cp>C. They proved that every participant changed behaviour\u003c/p>\n\u003cp>D. They were more important than the bird records\u003c/p>\n\u003cp>\u003cstrong>30. Which title best expresses the main idea?\u003c/strong>\u003c/p>\n\u003cp>A. Why Experts No Longer Need Evidence\u003c/p>\n\u003cp>B. The Exact Number of Birds in Every City\u003c/p>\n\u003cp>C. Why Central Parks Always Have More Birds\u003c/p>\n\u003cp>D. Public Bird Surveys Need Participation and Careful Interpretation\u003c/p>\n\u003ch3>Passage 4 Objects and Copies in a Museum\u003c/h3>\n\u003cp>\u003cstrong>Đoạn 1.\u003c/strong> Visitors to a small history museum recently encountered two versions of the same carved bowl. One was an original object kept behind glass; the other was a carefully made copy that visitors could hold. Some people welcomed the arrangement, while others wondered whether displaying a copy weakened the museum&#x27;s purpose. The disagreement raised a broader question: what do visitors gain from an original object, and what can a reproduction add? The answers depend partly on what the museum is trying to help people understand.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 2.\u003c/strong> An original object connects a visitor with a particular time and place. Marks on its surface may reveal how it was made or used. Its materials can provide evidence that a reproduction cannot fully preserve. For these reasons, replacing every original with a copy would remove something important. However, protecting fragile objects often requires barriers and controlled lighting. A visitor may be unable to see the bottom of a bowl or judge its weight. Preservation makes continued study possible, but it can limit immediate physical access.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 3.\u003c/strong> A reproduction offers different opportunities. A visitor who handles a copy can feel its size and test how easily it can be lifted. A teacher can use it to demonstrate an action without risking damage to the original. This is particularly helpful when the skill being explained involves movement, such as pouring from a narrow opening. Yet the copy should not be presented as an exact substitute for every purpose. A modern material may have a different weight, and a reconstructed pattern may include details that are uncertain.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 4.\u003c/strong> Clear labels are therefore essential. In one display, the museum showed which parts of a reconstructed bowl followed surviving evidence and which parts had been inferred. [A] These two colours were repeated on the labels beside the bowl. [B] These distinctions allowed visitors to separate what was known from what was proposed. [C] Without such information, a smooth, complete object could create a misleading impression of certainty. [D] Explaining uncertainty did not necessarily make the display less interesting; it could show visitors how historical knowledge is produced.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 5.\u003c/strong> The museum also discovered that visitor preferences varied. Some wanted a quiet encounter with an original; others learned more through handling and discussion. Providing both experiences was more useful than assuming a single method would suit everyone. Nevertheless, interactive exhibits required cleaning, supervision and occasional replacement. Their value could not be assessed merely by counting how often someone touched them. A popular activity might attract attention without helping visitors understand the historical question it was intended to address.\u003c/p>\n\u003cp>\u003cstrong>Đoạn 6.\u003c/strong> For its next exhibition, the museum planned to ask visitors to explain one thing they had learned and identify one question that remained uncertain. Staff would use those responses alongside observation and attendance figures. The aim was not to prove that originals or copies were universally better. It was to choose a combination appropriate to each object and learning goal. Authenticity and access were not always competing values: carefully described reproductions could support engagement with originals, provided the difference between historical evidence and modern interpretation remained clear.\u003c/p>\n\u003cp>\u003cstrong>31. What is the passage mainly concerned with?\u003c/strong>\u003c/p>\n\u003cp>A. Showing that old bowls have no historical value\u003c/p>\n\u003cp>B. Explaining why copies should replace all originals\u003c/p>\n\u003cp>C. Discussing how originals and reproductions can serve different learning purposes\u003c/p>\n\u003cp>D. Describing the price of museum tickets\u003c/p>\n\u003cp>\u003cstrong>32. According to paragraph 2, what can an original object provide?\u003c/strong>\u003c/p>\n\u003cp>A. Evidence in its materials and surface marks\u003c/p>\n\u003cp>B. Guaranteed physical access for every visitor\u003c/p>\n\u003cp>C. A complete answer to every historical question\u003c/p>\n\u003cp>D. Proof that all copies are inaccurate\u003c/p>\n\u003cp>\u003cstrong>33. Why does the author mention pouring from a narrow opening?\u003c/strong>\u003c/p>\n\u003cp>A. To explain why bowls should never be copied\u003c/p>\n\u003cp>B. To show that all copies have the correct weight\u003c/p>\n\u003cp>C. To describe a problem with museum ticketing\u003c/p>\n\u003cp>D. To illustrate learning through movement using a copy\u003c/p>\n\u003cp>\u003cstrong>34. The word “fragile” in paragraph 2 is closest in meaning to\u003c/strong>\u003c/p>\n\u003cp>A. expensive\u003c/p>\n\u003cp>B. easily damaged\u003c/p>\n\u003cp>C. unusual\u003c/p>\n\u003cp>D. recently discovered\u003c/p>\n\u003cp>\u003cstrong>35. Which of the following is NOT stated as a limitation of reproductions or interactive exhibits?\u003c/strong>\u003c/p>\n\u003cp>A. They may differ in weight from originals\u003c/p>\n\u003cp>B. They may require supervision\u003c/p>\n\u003cp>C. They prevent visitors from learning about movement\u003c/p>\n\u003cp>D. They may contain uncertain reconstructed details\u003c/p>\n\u003cp>\u003cstrong>36. Where in paragraph 4 should the following sentence be inserted: “For example, the surviving decoration was shown in one colour, while the proposed additions were shown in another.”?\u003c/strong>\u003c/p>\n\u003cp>A. [A]\u003c/p>\n\u003cp>B. [B]\u003c/p>\n\u003cp>C. [C]\u003c/p>\n\u003cp>D. [D]\u003c/p>\n\u003cp>\u003cstrong>37. In paragraph 5, “them” in “someone touched them” refers to\u003c/strong>\u003c/p>\n\u003cp>A. visitor preferences\u003c/p>\n\u003cp>B. original materials\u003c/p>\n\u003cp>C. historical questions\u003c/p>\n\u003cp>D. interactive exhibits\u003c/p>\n\u003cp>\u003cstrong>38. What does paragraph 5 suggest about a frequently used activity?\u003c/strong>\u003c/p>\n\u003cp>A. It must teach every visitor effectively\u003c/p>\n\u003cp>B. Its popularity alone does not establish its educational value\u003c/p>\n\u003cp>C. It should always be removed\u003c/p>\n\u003cp>D. It proves that original objects are unnecessary\u003c/p>\n\u003cp>\u003cstrong>39. The word “inferred” in paragraph 4 is closest in meaning to\u003c/strong>\u003c/p>\n\u003cp>A. destroyed deliberately\u003c/p>\n\u003cp>B. copied without change\u003c/p>\n\u003cp>C. worked out from available evidence\u003c/p>\n\u003cp>D. forgotten completely\u003c/p>\n\u003cp>\u003cstrong>40. Which statement best reflects the author’s conclusion?\u003c/strong>\u003c/p>\n\u003cp>A. A carefully explained combination can improve access while respecting historical evidence\u003c/p>\n\u003cp>B. Copies are always superior because people can touch them\u003c/p>\n\u003cp>C. Museums should choose either originals or copies for every exhibition\u003c/p>\n\u003cp>D. Uncertainty should be hidden to keep visitors interested\u003c/p>"}, {"id": 7, "title": "Đáp án và giải thích đề tự biên soạn", "html": "\u003cp>Chỉ mở phần này sau khi hoàn thành đề. Mỗi câu đúng tính một điểm thô để tự theo dõi. Không quy đổi điểm thô này thành chứng nhận B1/B2.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>B\u003c/td>\u003ctd>11\u003c/td>\u003ctd>C\u003c/td>\u003ctd>21\u003c/td>\u003ctd>C\u003c/td>\u003ctd>31\u003c/td>\u003ctd>C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>A\u003c/td>\u003ctd>12\u003c/td>\u003ctd>B\u003c/td>\u003ctd>22\u003c/td>\u003ctd>B\u003c/td>\u003ctd>32\u003c/td>\u003ctd>A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>D\u003c/td>\u003ctd>13\u003c/td>\u003ctd>A\u003c/td>\u003ctd>23\u003c/td>\u003ctd>D\u003c/td>\u003ctd>33\u003c/td>\u003ctd>D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>C\u003c/td>\u003ctd>14\u003c/td>\u003ctd>D\u003c/td>\u003ctd>24\u003c/td>\u003ctd>A\u003c/td>\u003ctd>34\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>A\u003c/td>\u003ctd>15\u003c/td>\u003ctd>C\u003c/td>\u003ctd>25\u003c/td>\u003ctd>C\u003c/td>\u003ctd>35\u003c/td>\u003ctd>C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>D\u003c/td>\u003ctd>16\u003c/td>\u003ctd>A\u003c/td>\u003ctd>26\u003c/td>\u003ctd>B\u003c/td>\u003ctd>36\u003c/td>\u003ctd>A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>B\u003c/td>\u003ctd>17\u003c/td>\u003ctd>D\u003c/td>\u003ctd>27\u003c/td>\u003ctd>D\u003c/td>\u003ctd>37\u003c/td>\u003ctd>D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>C\u003c/td>\u003ctd>18\u003c/td>\u003ctd>B\u003c/td>\u003ctd>28\u003c/td>\u003ctd>C\u003c/td>\u003ctd>38\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>A\u003c/td>\u003ctd>19\u003c/td>\u003ctd>C\u003c/td>\u003ctd>29\u003c/td>\u003ctd>A\u003c/td>\u003ctd>39\u003c/td>\u003ctd>C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>D\u003c/td>\u003ctd>20\u003c/td>\u003ctd>A\u003c/td>\u003ctd>30\u003c/td>\u003ctd>D\u003c/td>\u003ctd>40\u003c/td>\u003ctd>A\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Bài 1 Riverside Library\u003c/h3>\n\u003cp>\u003cstrong>Câu 1 — B.\u003c/strong> Toàn bài gồm mục tiêu, cách mượn, an toàn và đánh giá dịch vụ. A/C không có; D quá hẹp và không phản ánh cấu trúc bài.\u003c/p>\n\u003cp>\u003cstrong>Câu 2 — A.\u003c/strong> Đoạn 1: needed an item occasionally nhưng khó biện minh việc mua/lưu trữ. B/D nằm ngoài mục tiêu; C không được nêu.\u003c/p>\n\u003cp>\u003cstrong>Câu 3 — D.\u003c/strong> Modest mô tả quy mô khiêm tốn, được giải thích bằng a few. Không nói nguy hiểm, riêng tư hay hiện đại.\u003c/p>\n\u003cp>\u003cstrong>Câu 4 — C.\u003c/strong> Đoạn 2 giới hạn gia hạn một lần khi không ai đặt trước. A/B/D thêm điều kiện không có.\u003c/p>\n\u003cp>\u003cstrong>Câu 5 — A.\u003c/strong> Đoạn 3 nêu mục đích kiểm tra đủ bộ phận và trao đổi vấn đề. B không có; C không được nói; D trái việc vẫn nhắc book-return box.\u003c/p>\n\u003cp>\u003cstrong>Câu 6 — D.\u003c/strong> Đoạn 4: the rule applies to everyone. A/B được đoạn 2 cho phép; C là hành động được yêu cầu.\u003c/p>\n\u003cp>\u003cstrong>Câu 7 — B.\u003c/strong> Đối tượng bị đưa khỏi vòng cho mượn và cần kiểm tra là a damaged item. Thay danh từ này vào examined it thì đúng nghĩa.\u003c/p>\n\u003cp>\u003cstrong>Câu 8 — C.\u003c/strong> Số mượn chứng minh có sử dụng nhưng chưa đo chính xác khoản tiết kiệm. A/B kết luận quá mức; D không có dữ kiện.\u003c/p>\n\u003cp>\u003cstrong>Câu 9 — A.\u003c/strong> Hai tiêu chí là đáng tin và dùng thường xuyên, đặt trên số lượng. B/C/D trái ý giới hạn tiếp nhận và bảo dưỡng.\u003c/p>\n\u003cp>\u003cstrong>Câu 10 — D.\u003c/strong> Encouraging results đi cùng thận trọng về số liệu, an toàn và nguồn lực. Không phải phủ nhận, tức giận hay khẳng định thành công tuyệt đối.\u003c/p>\n\u003ch3>Bài 2 Choosing Working Hours\u003c/h3>\n\u003cp>\u003cstrong>Câu 11 — C.\u003c/strong> Bài xem thử nghiệm giờ linh hoạt, kết quả và hạn chế. D sai vì tổng giờ không giảm; A/B không phải luận điểm.\u003c/p>\n\u003cp>\u003cstrong>Câu 12 — B.\u003c/strong> Đoạn 1 quy định một khoảng họp chung 11–12. Giờ bắt đầu được chọn; C/D không áp dụng mọi người.\u003c/p>\n\u003cp>\u003cstrong>Câu 13 — A.\u003c/strong> Preceding eight weeks là tám tuần ngay trước giai đoạn thử. Không mặc nhiên bận nhất hoặc ngắn nhất.\u003c/p>\n\u003cp>\u003cstrong>Câu 14 — D.\u003c/strong> Đoạn 2 nói lịch có thể khác theo ngày, ghi trước để tránh nhầm lẫn. A/B không có; C trái nghĩa.\u003c/p>\n\u003cp>\u003cstrong>Câu 15 — C.\u003c/strong> Đoạn 1 nói giữ usual hours; đoạn 3 nêu A/B/D. Không được nhầm giờ linh hoạt với số giờ ít hơn.\u003c/p>\n\u003cp>\u003cstrong>Câu 16 — A.\u003c/strong> Đây là yếu tố gây nhiễu trong đánh giá: không tách riêng được hiệu ứng lịch làm. C trái ý thận trọng.\u003c/p>\n\u003cp>\u003cstrong>Câu 17 — D.\u003c/strong> Routine questions được giải đáp trên bảng câu hỏi. Không dùng một địa điểm ngoài đoạn.\u003c/p>\n\u003cp>\u003cstrong>Câu 18 — B.\u003c/strong> Câu hỏi thường lệ xử lý bất đồng bộ, giờ họp dành quyết định chung. A/C/D không phải mục đích.\u003c/p>\n\u003cp>\u003cstrong>Câu 19 — C.\u003c/strong> Họ đổi ca được nhưng không cùng về sớm. A trái điều kiện; B tuyệt đối hóa; D không có.\u003c/p>\n\u003cp>\u003cstrong>Câu 20 — A.\u003c/strong> Gia hạn thử và đo thêm phản hồi, mùa bận, ngoài giờ cho thấy cần bằng chứng. B quá mức; C/D trái mục tiêu.\u003c/p>\n\u003ch3>Bài 3 Counting Birds in the City\u003c/h3>\n\u003cp>\u003cstrong>Câu 21 — C.\u003c/strong> Đoạn 1: nhóm chuyên môn không đủ thời gian thăm mọi công viên, nên mở rộng quan sát qua cư dân. D là kết luận chưa có.\u003c/p>\n\u003cp>\u003cstrong>Câu 22 — B.\u003c/strong> Đoạn 2 phân biệt quan sát bằng 0 với không biết đã đi quan sát hay chưa. A/C/D không được nói.\u003c/p>\n\u003cp>\u003cstrong>Câu 23 — D.\u003c/strong> Genuine biological pattern là mẫu hình sinh học thực sự, khác mẫu do cách thu dữ liệu. Không liên quan độ phổ biến hay đơn giản.\u003c/p>\n\u003cp>\u003cstrong>Câu 24 — A.\u003c/strong> Đoạn 3: nhiều tình nguyện viên ở trung tâm, nơi dễ tiếp cận hơn, nên số lượt quan sát lệch. B/C/D trái hoặc không có.\u003c/p>\n\u003cp>\u003cstrong>Câu 25 — C.\u003c/strong> Đoạn 4: gap became smaller nhưng không mất hẳn. B tuyệt đối hóa kết quả; A/D không có.\u003c/p>\n\u003cp>\u003cstrong>Câu 26 — B.\u003c/strong> Giữ cả hai khả năng và chưa chốt nguyên nhân. A loại mất một khả năng; C/D trái nội dung.\u003c/p>\n\u003cp>\u003cstrong>Câu 27 — D.\u003c/strong> Ảnh được yêu cầu cho quan sát bất thường, sau đó người có kinh nghiệm xem ảnh. Không phải kiểm tra con người hay màu sắc riêng lẻ.\u003c/p>\n\u003cp>\u003cstrong>Câu 28 — C.\u003c/strong> Đoạn 2 yêu cầu đánh dấu chưa chắc thay vì chọn đại. A/B/D đều có trong hướng dẫn.\u003c/p>\n\u003cp>\u003cstrong>Câu 29 — A.\u003c/strong> Người thích chim có thể dễ tham gia và trả lời hơn, tạo thiên lệch chọn mẫu. B/C tuyệt đối; D không được so sánh.\u003c/p>\n\u003cp>\u003cstrong>Câu 30 — D.\u003c/strong> Toàn bài kết hợp lợi ích đóng góp công chúng với quy trình và giới hạn dữ liệu. Các đáp án còn lại đều quá mức hoặc sai.\u003c/p>\n\u003ch3>Bài 4 Objects and Copies in a Museum\u003c/h3>\n\u003cp>\u003cstrong>Câu 31 — C.\u003c/strong> Bài cân nhắc vai trò bổ sung của bản gốc và bản sao. A/B trái kết luận; D không có.\u003c/p>\n\u003cp>\u003cstrong>Câu 32 — A.\u003c/strong> Đoạn 2 nêu vật liệu và dấu vết. B trái giới hạn trưng bày; C/D là kết luận quá rộng.\u003c/p>\n\u003cp>\u003cstrong>Câu 33 — D.\u003c/strong> Ví dụ minh họa kỹ năng có chuyển động ở đoạn 3. Không phải bằng chứng về cân nặng hay cấm làm bản sao.\u003c/p>\n\u003cp>\u003cstrong>Câu 34 — B.\u003c/strong> Fragile nói dễ hỏng/vỡ, là lý do cần bảo vệ. Không tự động đồng nghĩa đắt, hiếm hay mới phát hiện.\u003c/p>\n\u003cp>\u003cstrong>Câu 35 — C.\u003c/strong> Đoạn 3 cho biết bản sao hỗ trợ học qua chuyển động, ngược với C. A/D ở đoạn 3; B ở đoạn 5.\u003c/p>\n\u003cp>\u003cstrong>Câu 36 — A.\u003c/strong> For example cụ thể hóa cách phân biệt phần có bằng chứng và phần suy dựng. Câu ngay sau [A] có These two colours, cần hai màu vừa được giới thiệu trong câu chèn. B/C/D đều để These two colours xuất hiện trước thông tin cần quy chiếu.\u003c/p>\n\u003cp>\u003cstrong>Câu 37 — D.\u003c/strong> Thứ người xem chạm là các hiện vật/trưng bày tương tác. Các danh từ khác không phù hợp cả logic lẫn văn cảnh.\u003c/p>\n\u003cp>\u003cstrong>Câu 38 — B.\u003c/strong> Bài nói có thể thu hút mà không giúp hiểu câu hỏi lịch sử. A/D tuyệt đối hóa; C không phải đề xuất trong bài.\u003c/p>\n\u003cp>\u003cstrong>Câu 39 — C.\u003c/strong> Inferred là suy dựng từ bằng chứng hiện có, không phải sao nguyên hoặc quên/phá bỏ. Đoạn đối chiếu known và proposed.\u003c/p>\n\u003cp>\u003cstrong>Câu 40 — A.\u003c/strong> Đoạn cuối ủng hộ phối hợp tùy mục tiêu và phân biệt rõ bằng chứng/diễn giải. B/C áp dụng tuyệt đối; D trái việc giải thích sự không chắc.\u003c/p>"}, {"id": 8, "title": "Nguồn đề minh họa và đề luyện có thể sử dụng", "html": "\u003ch3>8.1 Phân biệt đúng loại đề\u003c/h3>\n\u003cp>\u003cstrong>Đề minh họa do đơn vị khảo thí công bố\u003c/strong> giúp hiểu hình thức và cách đặt câu hỏi. \u003cstrong>Đề luyện\u003c/strong> dùng để rèn kỹ năng nhưng không mặc nhiên có độ khó đã chuẩn hóa. \u003cstrong>Đề thi thật đã công bố\u003c/strong> cần có nguồn xác nhận là đề đã sử dụng trong một kỳ thi cụ thể. Trong các nguồn kiểm tra cho cẩm nang này, chưa xác minh được một bộ đề Reading đã thi có thông báo công khai như vậy; không đổi nhãn “đề minh họa” thành “đề thật”.\u003c/p>\n\u003cp>Ngày đăng hoặc ngày tải lên không đồng nghĩa năm biên soạn câu hỏi. Nhiều trang có thể đăng cùng một đề. Hãy so bài mở đầu và chủ đề bốn bài trước khi tính đó là một đề mới.\u003c/p>\n\u003ch3>8.2 Danh mục có nguồn rõ ràng\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nguồn\u003c/th>\u003cth>Loại và nội dung đã kiểm tra\u003c/th>\u003cth>Cách dùng và tình trạng đáp án\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ULIS ĐHQGHN\u003c/td>\u003ctd>Trang Đề thi minh họa VSTEP.3–5 của Trung tâm Khảo thí\u003c/td>\u003ctd>Dùng làm điểm tham chiếu; trang nhúng file Google Drive. Đã xác minh trang nguồn, chưa xác minh nội dung/key bên trong file nhúng ở lần truy cập này\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ĐH Ngoại ngữ ĐH Đà Nẵng\u003c/td>\u003ctd>PDF đề mẫu có Reading 40 câu và key cuối file\u003c/td>\u003ctd>Bài về nghề nghiệp, thuê nhà New York, khí hậu và nguồn gốc sự sống. Dùng làm bài kiểm tra bấm giờ; che phần key trước khi làm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trung tâm Ngoại ngữ Tin học ĐH Sài Gòn\u003c/td>\u003ctd>PDF 19 trang; Reading ở trang PDF 8–17, 40 câu\u003c/td>\u003ctd>Bài về chim mỏ chéo, thiên hà, nghiên cứu đáy đại dương, dân số Canada. Không thấy key Reading trong PDF 19 trang đã xem; không tự coi đáp án trên trang khác là key của bộ này\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Trung tâm Ngoại ngữ ĐH Sư phạm TP HCM\u003c/td>\u003ctd>Trang thi thử bậc 3–5 có liên kết bài Đọc\u003c/td>\u003ctd>Trang công bố bài Đọc chấm tự động. Dùng để làm quen luyện trực tuyến; chưa thực hiện và nộp bài trong lần kiểm tra này\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Đường dẫn mở trực tiếp\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"https://vstep.vnu.edu.vn/sample-test/\" target=\"_blank\" rel=\"noopener noreferrer\">ULIS ĐHQGHN — Trang đề minh họa ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://vstep.ufl.udn.vn/files/2025/2025_9_3_41_23_569_de_thi_mau_vstep_3.5.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">ĐH Ngoại ngữ ĐH Đà Nẵng — PDF đề mẫu và đáp án ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://vstep.ufl.udn.vn/NLTA/Dinhdang/2025/De-thi-mau-Vstep-bac-3-52025.9.10067\" target=\"_blank\" rel=\"noopener noreferrer\">ĐH Ngoại ngữ ĐH Đà Nẵng — Trang đăng đề mẫu ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ttnnth-ngoaingu.sgu.edu.vn/tai-lieu-dinh-dang-de-thi-vstep/\" target=\"_blank\" rel=\"noopener noreferrer\">ĐH Sài Gòn — Trang tài liệu định dạng và đề mẫu ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ttnnth-ngoaingu.sgu.edu.vn/wp-content/uploads/2025/10/DE-THI-MAU-VSTEP.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">ĐH Sài Gòn — PDF đề mẫu ↗\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://vstep.hcmue.edu.vn/thi-thu-bac-345\" target=\"_blank\" rel=\"noopener noreferrer\">ĐH Sư phạm TP HCM — Trang thi thử bậc 3–5 ↗\u003c/a>\u003c/li>\u003c/ul>\n\u003cp>Trang đăng đề của Đà Nẵng phản hồi không ổn định khi kiểm tra, nhưng nội dung PDF đề và bảng key đã truy xuất được. Các đường dẫn ngoài có thể thay đổi; khi link tệp hỏng, quay về trang của đơn vị công bố. Đây là bốn \u003cstrong>nguồn truy cập\u003c/strong>, không khẳng định có bốn bộ câu hỏi hoàn toàn khác nhau.\u003c/p>\n\u003ch3>8.3 Cách khai thác đề ngoài sách\u003c/h3>\n\u003cp>Lần làm thứ nhất: dùng đúng 60 phút, không tra từ và không dừng đồng hồ. Ghi số câu đã làm chắc, số câu đoán và số câu bỏ sót. Sau đó so key nếu nguồn cung cấp; với mỗi câu sai, chỉ ra vị trí bằng chứng và lý do phương án bạn chọn không đúng.\u003c/p>\n\u003cp>Lần học thứ hai: phân loại lỗi thành từ vựng, ngữ pháp, không tìm được bằng chứng, suy luận quá mức, bỏ sót phủ định hoặc thiếu thời gian. Học tối đa 10–15 từ có khả năng dùng lại từ đề đó. Một tuần sau, giải thích lại các câu từng sai nhưng không dùng điểm làm lại để dự báo trình độ.\u003c/p>\n\u003cp>Không cần sưu tầm thật nhiều đề rồi chỉ xem đáp án. Ba đề được chữa kỹ và chưa biết trước đáp án có giá trị chẩn đoán tốt hơn nhiều lần làm lại cùng một đề được đăng ở các website khác nhau.\u003c/p>"}, {"id": 9, "title": "Lộ trình tự học và cách theo dõi tiến bộ", "html": "\u003ch3>9.1 Kế hoạch sáu tuần có thể điều chỉnh\u003c/h3>\n\u003cp>Kế hoạch sau giả định bạn dành khoảng 60 phút mỗi ngày cho Reading, năm đến sáu ngày mỗi tuần. Đây là cách phân bổ công việc, không phải cam kết đạt B1 sau sáu tuần. Nếu đang dưới nền A2 vững hoặc mỗi ngày chỉ học ít thời gian, kéo dài phần xây nền.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tuần\u003c/th>\u003cth>Trọng tâm\u003c/th>\u003cth>Bài học và sản phẩm cần có\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Đo đầu vào và đọc câu\u003c/td>\u003ctd>Làm một bài 60 phút chưa học; đọc R1; học 30–40 từ ưu tiên; ghi 5 câu dài đã tự tách ý\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Ý chính và chi tiết\u003c/td>\u003ctd>R2, R3; luyện skimming → scanning → đọc bằng chứng; hoàn thành Optical Fiber và một bài dài\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Phủ định và paraphrase\u003c/td>\u003ctd>R4, R5; ghi 10 bẫy đổi chủ thể/phạm vi; mỗi buổi chữa ít nhất 3 câu sai\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Suy luận, mục đích và chèn câu\u003c/td>\u003ctd>R6, R7; làm French Quarter và Carver trước khi xem lời giải; ôn từ tuần 1–3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Tốc độ và tổng hợp\u003c/td>\u003ctd>Làm đề tự biên soạn trong tài liệu; luyện một nguồn minh họa; phân tích câu đúng do đoán\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Kiểm tra đề mới và bốn kỹ năng\u003c/td>\u003ctd>Dùng đề chưa học, rà độ ổn định; kiểm tra Nghe và nhờ chấm Viết/Nói trước khi quyết định dự thi\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Trong những ngày không làm đề đủ giờ: 10 phút ôn từ cũ; 15 phút học một dạng; 20 phút làm bài; 15 phút chữa và ghi sổ lỗi. Ngày làm đề: dành trọn 60 phút làm bài và bố trí một buổi khác để chữa. Không vừa xem đáp án vừa tính thành tích.\u003c/p>\n\u003ch3>9.2 Mẫu sổ lỗi\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ngày và bài\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Tôi chọn và đáp án\u003c/th>\u003cth>Bằng chứng\u003c/th>\u003cth>Nguyên nhân sai\u003c/th>\u003cth>Quy tắc cần nhớ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ví dụ Pine Trees\u003c/td>\u003ctd>2\u003c/td>\u003ctd>D → A\u003c/td>\u003ctd>Vỏ mở, hạt thoát ra\u003c/td>\u003ctd>Bị hút bởi forest fires\u003c/td>\u003ctd>Chọn nghĩa release trong câu, không chọn từ cùng chủ đề\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ví dụ Acid Rain\u003c/td>\u003ctd>3\u003c/td>\u003ctd>A → C\u003c/td>\u003ctd>A được nêu; sông không được nêu ở đoạn 3\u003c/td>\u003ctd>Quên NOT stated\u003c/td>\u003ctd>Khoanh yêu cầu phủ định trước khi dò\u003c/td>\u003c/tr>\u003ctr>\u003ctd>__________\u003c/td>\u003ctd>___\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003c/tr>\u003ctr>\u003ctd>__________\u003c/td>\u003ctd>___\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003ctd>__________\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>9.3 Bảng theo dõi đề mới\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Đề và nguồn\u003c/th>\u003cth>Ngày\u003c/th>\u003cth>Đúng trên 40\u003c/th>\u003cth>Thời gian\u003c/th>\u003cth>Đúng nhờ đoán\u003c/th>\u003cth>Dạng yếu nhất\u003c/th>\u003cth>Việc sửa tiếp theo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Đầu vào\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đề mới 1\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đề mới 2\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đề mới 3\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003ctd>____\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Cách ra quyết định:\u003c/strong> nếu điểm thô tăng nhưng vẫn vượt 60 phút, ưu tiên tốc độ dò và bỏ câu tạm thời. Nếu làm đủ giờ nhưng sai nhiều từ nối/phủ định, sửa kỹ thuật trước khi tăng lượng từ. Nếu các câu sai tập trung ở paraphrase, luyện giữ nguyên chủ thể, lượng và quan hệ nguyên nhân. Nếu đọc tốt nhưng điểm toàn bài thấp, chuyển thêm thời gian sang kỹ năng đang kéo trung bình xuống.\u003c/p>\n\u003ch3>9.4 Tờ ghi nhớ trước buổi luyện\u003c/h3>\n\u003cul>\u003cli>Đọc yêu cầu câu hỏi trước khi tìm thông tin; khoanh NOT, EXCEPT và phạm vi đoạn.\u003c/li>\u003cli>Đọc lướt để có bản đồ; dò để đến đúng chỗ; đọc kỹ để quyết định.\u003c/li>\u003cli>Đáp án đúng phải có căn cứ, không chỉ có từ giống bài.\u003c/li>\u003cli>Với từ vựng, thử nghĩa vào câu; với đại từ, thử thay danh từ.\u003c/li>\u003cli>Với paraphrase, giữ ai làm gì, mức độ và quan hệ logic.\u003c/li>\u003cli>Với suy luận, chọn kết luận nhỏ nhất được hỗ trợ.\u003c/li>\u003cli>Với chèn câu, kiểm tra cả phía trước và phía sau.\u003c/li>\u003cli>Theo dõi thời gian; quay lại câu khó sau; kiểm tra câu chưa trả lời.\u003c/li>\u003cli>Sau buổi học, giải thích được lỗi quan trọng hơn chỉ ghi một con số.\u003c/li>\u003c/ul>"}, {"id": 10, "title": "Nguồn đối chiếu", "html": "\u003cp>\u003cstrong>Sách gốc do người học cung cấp:\u003c/strong> Tài liệu luyện thi tổng hợp VSTEP bậc 3 B1; Lê Huy Lâm, Trương Hoàng Duy, La Trường Duy, Huỳnh Thành Công; Nhà xuất bản Tổng hợp Thành phố Hồ Chí Minh. Bản PDF scan 366 trang. Các nhận xét và trích đoạn trong cẩm nang dẫn theo vị trí trang PDF. Chưa xác định năm xuất bản chỉ từ những trang nhận diện đã kiểm tra; không lấy ngày tạo file scan làm năm xuất bản.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S1]\u003c/a> ULIS ĐHQGHN, Test format.\u003c/strong> Nguồn cấu trúc Reading: thời gian, số bài, số câu và tổng độ dài văn bản. \u003ca href=\"https://vstep.vnu.edu.vn/test-format/\" target=\"_blank\" rel=\"noopener noreferrer\">Mở nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S2]\u003c/a> ULIS ĐHQGHN, Scores and Levels.\u003c/strong> Nguồn khoảng điểm và bậc năng lực. \u003ca href=\"https://vstep.vnu.edu.vn/scores-levels/\" target=\"_blank\" rel=\"noopener noreferrer\">Mở nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S3]\u003c/a> Trường Quốc tế ĐHQGHN, Giới thiệu format đề thi VSTEP và tiêu chí chấm bài thi B2 VSTEP.\u003c/strong> Nguồn cách dùng trung bình bốn kỹ năng và quy tắc làm tròn được trang công bố. \u003ca href=\"https://www.is.vnu.edu.vn/gioi-thieu-mau-de-thi-va-tieu-chi-cham-bai-thi-vstep/\" target=\"_blank\" rel=\"noopener noreferrer\">Mở nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S4]\u003c/a> ULIS ĐHQGHN, Đề thi minh họa VSTEP.3–5.\u003c/strong> \u003ca href=\"https://vstep.vnu.edu.vn/sample-test/\" target=\"_blank\" rel=\"noopener noreferrer\">Mở nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S5]\u003c/a> ĐH Ngoại ngữ ĐH Đà Nẵng, Đề mẫu VSTEP.3–5 và bảng key.\u003c/strong> \u003ca href=\"https://vstep.ufl.udn.vn/files/2025/2025_9_3_41_23_569_de_thi_mau_vstep_3.5.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Mở PDF ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S6]\u003c/a> Trung tâm Ngoại ngữ Tin học ĐH Sài Gòn, Tài liệu định dạng đề thi VSTEP và PDF đề mẫu.\u003c/strong> \u003ca href=\"https://ttnnth-ngoaingu.sgu.edu.vn/tai-lieu-dinh-dang-de-thi-vstep/\" target=\"_blank\" rel=\"noopener noreferrer\">Trang nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S7]\u003c/a> Trung tâm Ngoại ngữ ĐH Sư phạm TP HCM, Thi thử bậc 345.\u003c/strong> \u003ca href=\"https://vstep.hcmue.edu.vn/thi-thu-bac-345\" target=\"_blank\" rel=\"noopener noreferrer\">Trang nguồn ↗\u003c/a>.\u003c/p>\n\u003cp>Các chiến lược làm bài, mốc điểm thô luyện tập, lịch ôn và lựa chọn từ vựng là đề xuất sư phạm trong cẩm nang, không phải quy định khảo thí hoặc một danh sách từ chính thức của VSTEP.\u003c/p>"}], "intro": "\u003ch2>Cẩm nang ôn VSTEP Reading mục tiêu B1\u003c/h2>\n\u003cp>Đánh giá sách và hướng dẫn tự học có giải thích bằng tiếng Việt\u003c/p>\n\u003cp>Tài liệu được biên soạn cho người học hướng tới B1 và muốn xây nền để tiến tới B2. Giáo trình đối chiếu là \u003cstrong>Tài liệu luyện thi tổng hợp VSTEP bậc 3 B1\u003c/strong>, do Lê Huy Lâm, Trương Hoàng Duy, La Trường Duy và Huỳnh Thành Công biên soạn, Nhà xuất bản Tổng hợp Thành phố Hồ Chí Minh. Bản được cung cấp là PDF scan 366 trang.\u003c/p>\n\u003cp>\u003cstrong>Kết luận:\u003c/strong> Có thể dùng sách làm giáo trình nền để ôn B1, đặc biệt để học từng dạng câu hỏi Reading. Tuy nhiên, học hết sách không đồng nghĩa chắc chắn đạt B1. Cần bổ sung đáp án và audio còn thiếu trong bản gửi, luyện đề mới đủ 60 phút, và kiểm tra cả bốn kỹ năng. Phần mở rộng trong sách hữu ích cho B2 nhưng chưa đủ để xem đây là giáo trình B2 toàn diện.\u003c/p>\n\u003cp>Ngày đối chiếu nguồn thi và tài liệu công khai: \u003cstrong>05/11/2026\u003c/strong>. Mọi số trang sách trong cẩm nang là \u003cstrong>vị trí trang trong PDF\u003c/strong>, tính bìa là trang 1; dùng ô chuyển trang của trình đọc PDF, không dựa vào số trang in ở chân trang vì một số vị trí không trùng nhau.\u003c/p>\n\u003ch2>Cách dùng tài liệu này\u003c/h2>\n\u003cp>Đọc phần 1 và 2 trước để hiểu mục tiêu. Học phần 3 theo đúng thứ tự R1 đến R7 của sách, sau đó dùng phần 4 để luyện hai bài dài có lời giải từng câu. Học từ ở phần 5 song song, mỗi ngày một nhóm nhỏ. Chỉ mở đáp án đề luyện ở phần 7 sau khi hoàn thành phần 6. Phần 8 tập hợp các nguồn đề công khai; phần 9 là lộ trình và sổ lỗi.\u003c/p>\n\u003cp>\u003cstrong>Nguồn của đáp án:\u003c/strong> Lời giải bài sách trong tài liệu này được biên soạn bằng cách đối chiếu đoạn văn, không phải đáp án chính thức của nhà xuất bản. Đề ở phần 6 là đề tự biên soạn, không phải đề thi thật và chưa được chuẩn hóa độ khó. Các đề do trường công bố được dẫn bằng đường liên kết ở phần 8, tách rõ với đề luyện.\u003c/p>", "lessons": [{"id": "3.1", "title": "Từ vựng trong ngữ cảnh theo R1", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> closest in meaning to, most likely means, could best be replaced by. \u003cstrong>Cách làm:\u003c/strong> xác định từ loại → đọc câu chứa từ và vùng lân cận → tìm định nghĩa, ví dụ hoặc đối lập → dự đoán nghĩa → thử thay lựa chọn vào câu.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Pine Trees, PDF 122, câu 1.\u003c/strong> Bài mô tả resin là một “sticky, glue-like fluid”. Các lựa chọn là oil, liquid, blood và chemical. Đáp án \u003cstrong>B, liquid\u003c/strong>: fluid chỉ chất lỏng. Oil quá hẹp; blood sai ngữ cảnh; chemical là một nhóm chất, không diễn đạt đúng đặc tính đang được hỏi. Bạn chỉ cần mạch mô tả nhựa cây, không cần dịch cả bài.\u003c/p>\n\u003cp>\u003cstrong>Pine Trees, câu 2.\u003c/strong> Nón thông mở vỏ để “release the seeds”. Chọn \u003cstrong>A, free\u003c/strong>: giải phóng/để hạt thoát ra. Restore là khôi phục; break là làm vỡ; burn là đốt. Từ forest fires có trong bài không khiến burn thành đáp án; đó là một tác nhân giúp vỏ mở, không phải nghĩa của release.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ root, PDF 121.\u003c/strong> “Ancient Greece is thought to be the root of European cultures.” Root ở đây là nguồn gốc/nền tảng; chọn \u003cstrong>A, basis\u003c/strong>, không chọn underground chỉ vì bạn từng học root là rễ cây. Mẹo có ích: nếu một nghĩa quen thuộc làm câu vô lý, quay về ngữ cảnh.\u003c/p>"}, {"id": "3.2", "title": "Ý chính và tiêu đề theo R2", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> main idea, mainly discuss, best title. \u003cstrong>Cách làm:\u003c/strong> viết chủ đề + điều tác giả nói về chủ đề; đối chiếu với tất cả các đoạn. Đáp án phải đủ rộng để bao quát nhưng không rộng hơn bài.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Mural Art, PDF 126.\u003c/strong> Bài đi từ tranh hang động đến nghệ sĩ châu Âu và tranh tường hiện đại. Chọn \u003cstrong>B: Mural art has a long and interesting history.\u003c/strong> A nói về điều nghệ thuật dạy ta, rộng hơn nội dung thực; C nói có thể vẽ ở bất cứ đâu, không phải trọng tâm; D nói vật liệu vẽ, không bao quát tiến trình lịch sử.\u003c/p>\n\u003cp>Đừng chỉ đọc câu đầu/cuối rồi chốt. Sách cũng lưu ý điều này: câu cuối Mural Art là một lời gợi ý vẽ tranh tường, nhưng cả bài không chủ yếu hướng dẫn bạn vẽ. Tự kiểm tra bằng câu: “Nếu đặt tiêu đề này, phần lớn nội dung có nằm dưới nó không?”\u003c/p>"}, {"id": "3.3", "title": "Chi tiết theo R3", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> according to, it is stated, who/when/where/why/how. \u003cstrong>Cách làm:\u003c/strong> xác định đúng phạm vi đoạn → dò từ khóa → đọc kỹ câu chứng minh → so ý, không so số từ trùng nhau.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Optical Fiber, PDF 140–141, câu 4.\u003c/strong> Hỏi copper cable từng được dùng để làm gì. Bằng chứng mở đầu đoạn 4 là copper cable was used to send electric signals. Chọn \u003cstrong>D, send electric signals\u003c/strong>. B nói việc chiếu sáng dòng nước, thuộc lịch sử sử dụng nguyên lý quang học; C nói nhìn trong dạ dày, thuộc công cụ y tế; A đảo sai quan hệ vật liệu.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ câu 5 cùng bài.\u003c/strong> Hỏi điều đúng ở đoạn 5 về optical fibers. Chọn \u003cstrong>C, cannot carry power\u003c/strong> vì văn bản nói cannot send power along with a signal. Cannot carry và cannot send diễn đạt tương đương trong câu này. Đừng chọn “many disadvantages”: bài giới hạn nhược điểm trong một số tình huống, không khẳng định nhược điểm rất nhiều.\u003c/p>"}, {"id": "3.4", "title": "Câu phủ định theo R4", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> NOT true, NOT mentioned, EXCEPT, LEAST likely. Viết một dấu nhắc “tìm ngoại lệ” trước khi làm. Kiểm chứng từng lựa chọn; ba lựa chọn được hỗ trợ thì lựa chọn còn lại là ứng viên cần kiểm tra.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Acid Rain, PDF 154, câu 3.\u003c/strong> Hỏi điều NOT stated trong đoạn 3. A thay đổi pH của đất, B ngăn cây tăng trưởng, D có liên hệ với bệnh ở cây đều được đoạn văn hỗ trợ. Chọn \u003cstrong>C, turns rivers into strong acid\u003c/strong> vì đoạn 3 không nêu thông tin về sông. Có thể bạn biết mưa axit ảnh hưởng nước, nhưng kiến thức ngoài bài không làm một ý trở thành “đã được nhắc”.\u003c/p>\n\u003cp>\u003cstrong>NOT mentioned khác NOT true:\u003c/strong> chưa được nói đến không có nghĩa là sai ngoài đời. Với EXCEPT, có khi ngoại lệ trái bài, có khi không được hỗ trợ, tùy câu dẫn. Đừng tự đổi câu hỏi sang “ý nào sai tuyệt đối”.\u003c/p>"}, {"id": "3.5", "title": "Diễn đạt tương đương theo R5", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> best paraphrases, essential information, highlighted sentence. Tách câu gốc thành các mệnh đề; giữ nguyên ai làm gì, nguyên nhân/kết quả, thời gian, điều kiện, so sánh và mức độ.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Snowflakes, PDF 165.\u003c/strong> Câu gốc nói hình dạng bông tuyết được quyết định bởi nhiệt độ. Chọn \u003cstrong>C: The shape of snowflakes depends on the temperature.\u003c/strong> A đảo chiều quan hệ thành dùng hình dạng để dự đoán nhiệt độ; B đổi shape thành size; D bỏ mất nội dung trọng tâm là hình dạng.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Carver, PDF 199–200, câu 6.\u003c/strong> Nếu trồng bông liên tiếp thì chất lượng đất giảm. Chọn \u003cstrong>A: The soil will get worse due to repeated planting of cotton.\u003c/strong> B chỉ nói dùng cùng đất, bỏ kết quả; C biến giảm chất lượng thành giảm lượng đất; D đổi đối tượng bị giảm chất lượng thành cây bông.\u003c/p>\n\u003cp>Các phép đổi thường gặp: buy → purchase; help → enable somebody to; because → so với vị trí hai vế được điều chỉnh; active → passive; carefully → in a careful way; not as…as → so sánh hơn theo chiều ngược lại. Chỉ đồng nghĩa khi toàn bộ câu vẫn giữ ý.\u003c/p>"}, {"id": "3.6", "title": "Mục đích theo R6", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> Why does the author mention…; in order to; purpose. Hỏi \u003cstrong>vì sao tác giả đưa chi tiết vào\u003c/strong>, không chỉ hỏi chi tiết đó có nghĩa gì. Đọc câu trước và câu sau ví dụ để tìm ý mà ví dụ đang phục vụ.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Magnets, PDF 175.\u003c/strong> Tác giả nhắc Magnesia để giải thích nguồn gốc của từ magnetism. Chọn \u003cstrong>C: To point out that the word for magnetism has an origin.\u003c/strong> B đòi hỏi so sánh hai nơi nhưng bài không làm vậy; D suy thành nam châm ở khắp nơi, vượt thông tin.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Vietnamese New Year, PDF 179.\u003c/strong> Tác giả nói món ăn mang ý nghĩa đặc biệt rồi nêu bánh nếp tượng trưng cho trời và đất. Đáp án sát nhất là \u003cstrong>B: To give an example of a food with a certain meaning.\u003c/strong> D chỉ nói ví dụ món ăn Tết, có liên quan nhưng bỏ mất chức năng giải thích ý nghĩa biểu tượng.\u003c/p>\n\u003cp>Nhóm động từ hữu ích: illustrate = minh họa; explain = giải thích; compare = so sánh; contrast = làm rõ khác biệt; support = hỗ trợ lập luận; warn = cảnh báo; criticize = phê bình; persuade = thuyết phục.\u003c/p>"}, {"id": "3.7", "title": "Chèn câu theo R7", "html": "\u003cp>\u003cstrong>Nhận diện:\u003c/strong> In which space…will the following sentence fit? Đọc câu cần chèn trước. Khoanh từ móc nối: this, these, such, another, however, therefore, also, he/she/it. Tìm ý mà từ đó quy chiếu, rồi kiểm tra cả trước lẫn sau vị trí chèn.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Astronauts, PDF 192.\u003c/strong> Câu cần chèn bắt đầu “Based on this definition” và nói 454 người. Đoạn văn đưa định nghĩa của Hoa Kỳ trước, sau đó dùng However để giới thiệu định nghĩa FAI với con số khác. Chọn \u003cstrong>[B]\u003c/strong>, ngay sau định nghĩa Hoa Kỳ, trước However. “This definition” có chỗ bám rõ; hai hệ định nghĩa được giữ tách biệt. Các con số là dữ kiện trong bài sách, không dùng như số liệu hiện hành.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ The Big Dipper, PDF 193, câu 1.\u003c/strong> Câu cần chèn nói “This is why Ursa Major is also called the Great Bear.” Chọn \u003cstrong>[1D]\u003c/strong>, ngay sau câu mô tả hình sắp xếp các sao giống một con gấu. This quy chiếu cả ý trước đó, không chỉ một danh từ gần nhất.\u003c/p>\n\u003cp>Không chèn chỉ vì thấy một từ lặp. Hãy đọc chuỗi ba câu: câu trước → câu chèn → câu sau. Nếu đại từ không rõ hoặc mạch ý nhảy đột ngột, thử vị trí khác.\u003c/p>"}, {"id": "3.8", "title": "Đại từ quy chiếu", "html": "\u003cp>Dạng này xuất hiện trong bài tập tổng hợp dù không có một chương riêng cùng cấp R1–R7. Hỏi refers to, they/them/which/this. Kiểm tra số ít/số nhiều, ngữ pháp và nghĩa; thay danh từ vào chỗ đại từ để thử.\u003c/p>\n\u003cp>\u003cstrong>Optical Fiber, PDF 141, câu 2:\u003c/strong> “telephone companies began to use fiber optic cables. They used them to send telephone signals…” They là các công ty, \u003cstrong>them là fiber optic cables, đáp án B\u003c/strong>. Không thể thay them bằng companies vì công ty dùng cáp để truyền tín hiệu, không dùng các công ty làm vật truyền.\u003c/p>\n\u003cp>\u003cstrong>Carver, PDF 199–200, câu 2:\u003c/strong> which occurred in January 1865 quy chiếu sự chấm dứt chế độ nô lệ tại Missouri, \u003cstrong>C, the end of slavery\u003c/strong>. Danh từ đứng gần nhất không tự động là đáp án; “Missouri xảy ra vào tháng 1” không có nghĩa.\u003c/p>"}, {"id": "3.9", "title": "Suy luận và thái độ", "html": "\u003cp>\u003cstrong>Suy luận:\u003c/strong> inferred, implied, suggests, most likely. Viết “dữ kiện trong bài → kết luận nhỏ nhất hợp lý”. Không thêm giả định lớn. \u003cstrong>French Quarter, PDF 182–183, câu 1:\u003c/strong> có ảnh hưởng từ nhiều nền văn hóa → \u003cstrong>B, is not built in a single style\u003c/strong>. Không đủ cơ sở suy ra khu phố mới xây hoặc nằm ngoài thành phố.\u003c/p>\n\u003cp>\u003cstrong>Thái độ:\u003c/strong> tìm từ đánh giá và mức độ khẳng định. Ví dụ tự biên soạn: “The scheme is promising, although its long-term costs remain uncertain.” Thái độ phù hợp là cautiously optimistic, lạc quan có dè dặt; không phải hoàn toàn phản đối hoặc tin chắc thành công. Tránh nhầm thái độ của người được trích lời với thái độ tác giả.\u003c/p>"}, {"id": "3.10", "title": "Những mẹo nên dùng và mẹo nên bỏ", "html": "\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nên dùng\u003c/th>\u003cth>Vì sao\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tự trả lời ngắn trước khi so lựa chọn\u003c/td>\u003ctd>Giảm ảnh hưởng của đáp án gây nhiễu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tìm paraphrase và giữ mức độ\u003c/td>\u003ctd>Most không bằng all; may không bằng must\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ghi bằng chứng cho câu đúng khi chữa\u003c/td>\u003ctd>Phân biệt hiểu bài với đoán trúng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Xem lại câu hỏi sau khi tìm thông tin\u003c/td>\u003ctd>Tránh trả lời đúng thông tin nhưng sai yêu cầu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Làm câu dễ trước và đặt giới hạn thời gian\u003c/td>\u003ctd>Giữ cơ hội lấy điểm ở các câu còn lại\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chọn một phương án tốt nhất cho câu còn trống trước khi hết giờ\u003c/td>\u003ctd>Hoàn thành bài theo hướng dẫn làm bài; không bỏ sót vì mắc ở một câu\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Không có quy tắc đáng tin rằng đáp án dài nhất thường đúng, câu có từ giống bài luôn đúng, hoặc đáp án C xuất hiện nhiều hơn. Từ tuyệt đối như always/never là dấu hiệu cần kiểm tra, \u003cstrong>không phải lý do tự động loại\u003c/strong>. Câu hỏi chi tiết có thể gần thứ tự văn bản nhưng không nên xem đó là luật. Một tên khoa học lạ có thể không cần học thuộc nếu bài đã giải thích nó.\u003c/p>"}], "vocab": [{"id": 0, "group": 0, "term": "classify", "pos": "v", "meaning": "phân loại", "synonym": "categorize", "antonym": "—"}, {"id": 1, "group": 0, "term": "evergreen", "pos": "adj", "meaning": "xanh quanh năm", "synonym": "keeping leaves all year", "antonym": "deciduous"}, {"id": 2, "group": 0, "term": "needle", "pos": "n", "meaning": "lá kim", "synonym": "a thin pointed leaf", "antonym": "—"}, {"id": 3, "group": 0, "term": "resin", "pos": "n", "meaning": "nhựa cây dạng nhựa dính", "synonym": "a sticky plant substance", "antonym": "—"}, {"id": 4, "group": 0, "term": "sticky", "pos": "adj", "meaning": "dính", "synonym": "adhesive", "antonym": "non-sticky"}, {"id": 5, "group": 0, "term": "fluid", "pos": "n", "meaning": "chất lỏng", "synonym": "liquid", "antonym": "—"}, {"id": 6, "group": 0, "term": "cone", "pos": "n", "meaning": "nón thông", "synonym": "seed-bearing structure", "antonym": "—"}, {"id": 7, "group": 0, "term": "seed", "pos": "n", "meaning": "hạt", "synonym": "a plant's reproductive structure", "antonym": "—"}, {"id": 8, "group": 0, "term": "mature", "pos": "adj", "meaning": "trưởng thành, phát triển đầy đủ", "synonym": "fully developed", "antonym": "immature"}, {"id": 9, "group": 0, "term": "release", "pos": "v", "meaning": "giải phóng, thả ra", "synonym": "free; let out", "antonym": "retain"}, {"id": 10, "group": 1, "term": "mural", "pos": "n", "meaning": "tranh tường", "synonym": "wall painting", "antonym": "—"}, {"id": 11, "group": 1, "term": "canvas", "pos": "n", "meaning": "vải dùng để vẽ tranh", "synonym": "painting cloth", "antonym": "—"}, {"id": 12, "group": 1, "term": "ancient", "pos": "adj", "meaning": "cổ đại", "synonym": "very old", "antonym": "modern"}, {"id": 13, "group": 1, "term": "advanced", "pos": "adj", "meaning": "tiên tiến, phát triển cao", "synonym": "highly developed", "antonym": "basic"}, {"id": 14, "group": 1, "term": "accurately", "pos": "adv", "meaning": "một cách chính xác", "synonym": "correctly", "antonym": "inaccurately"}, {"id": 15, "group": 1, "term": "unique", "pos": "adj", "meaning": "độc đáo, duy nhất", "synonym": "one of a kind", "antonym": "ordinary"}, {"id": 16, "group": 1, "term": "influential", "pos": "adj", "meaning": "có ảnh hưởng lớn", "synonym": "having a strong effect", "antonym": "—"}, {"id": 17, "group": 1, "term": "masterpiece", "pos": "n", "meaning": "kiệt tác", "synonym": "an outstanding work", "antonym": "—"}, {"id": 18, "group": 1, "term": "inspire", "pos": "v", "meaning": "truyền cảm hứng", "synonym": "motivate", "antonym": "discourage"}, {"id": 19, "group": 1, "term": "survive", "pos": "v", "meaning": "tồn tại, sống sót", "synonym": "continue to exist", "antonym": "perish"}, {"id": 20, "group": 2, "term": "character", "pos": "n", "meaning": "nhân vật", "synonym": "a person in a story", "antonym": "—"}, {"id": 21, "group": 2, "term": "chore", "pos": "n", "me
