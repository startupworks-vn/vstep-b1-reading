.flash-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .7s cubic-bezier(.65,0,.35,1);transform:translateY(var(--lift,0)) rotateY(var(--rot,0deg))}
.flashcard.is-flipped{--rot:180deg}
.flash-face{grid-area:1/1;position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:340px;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:box-shadow .35s var(--ease-out)}
.flash-face:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--green)}
.flash-face.front{transform:rotateY(0deg) translateZ(1px)}
.flash-face.back{transform:rotateY(180deg) translateZ(1px)}
/* Safari safety: hide the face turned away at the midpoint of the flip, independent of backface-visibility */
.flash-face{transition:box-shadow .35s var(--ease-out),visibility 0s linear .35s}
.flashcard.is-flipped .flash-face.front,.flashcard:not(.is-flipped) .flash-face.back{visibility:hidden}
.flash-face.back:before{background:var(--orange)}
.flash-face[inert]{pointer-events:none}
.flash-face .flip-area{cursor:pointer}
@media(hover:hover){
 .flashcard:hover{--lift:-6px}
 .flashcard:hover .flash-face{box-shadow:0 22px 48px #173f3324,0 4px 10px #173f3312}
 .test-grid>.card,.weeks>.card,.source-grid>*{transition:transform .3s var(--ease-out),box-shadow .3s var(--ease-out)}
 .test-grid>.card:hover,.source-grid>*:hover{transform:translateY(-3px);box-shadow:0 16px 36px #173f331c}
}
.flashcard.enter-next{animation:card-in-next .45s var(--ease-out)}
.flashcard.enter-prev{animation:card-in-prev .45s var(--ease-out)}
@keyframes card-in-next{from{opacity:0;transform:translateX(36px) scale(.98)}to{opacity:1;transform:none}}
@keyframes card-in-prev{from{opacity:0;transform:translateX(-36px) scale(.98)}to{opacity:1;transform:none}}
/* Burst particles (fixed layer, survives re-render) */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.fx-dot{position:absolute;width:var(--s,7px);height:var(--s,7px);border-radius:var(--r,2px);background:var(--c);left:var(--x);top:var(--y);opacity:0;animation:fx-burst var(--d,.8s) var(--ease-out) forwards}
@keyframes fx-burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rz)) scale(1)}}
.btn.pulse{animation:btn-pulse .5s var(--ease-spring)}
@keyframes btn-pulse{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}
/* Quiz options */
.option{transition:background-color .25s,border-color .25s,box-shadow .25s,transform .2s}
@media(hover:hover){.option:hover{background:color-mix(in srgb,var(--mint) 45%,var(--paper));border-color:color-mix(in srgb,var(--green) 45%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}}
.option:active{transform:scale(.985)}
.option.chosen{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 16%,transparent)}
.option.just-chosen{animation:opt-pop .42s var(--ease-spring)}
.option.just-chosen input{animation:radio-pop .42s var(--ease-spring)}
@keyframes opt-pop{0%{transform:scale(.97)}60%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes radio-pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.question-dots button{transition:background-color .3s,border-color .3s,color .3s,transform .3s var(--ease-spring)}
.question-dots button.bump{transform:scale(1.15)}
/* Session progress */
.session-progress{width:100%;height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:2px 0 12px}
.session-progress>span{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--green),#3f9a7f);transition:width .6s var(--ease-out);position:relative}
.session-progress>span:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff70,transparent);transform:translateX(-100%)}
.session-progress.grow>span:after{animation:shine .9s ease-out}
@keyframes shine{to{transform:translateX(100%)}}
.progress>span{transition:width .9s var(--ease-out)}
/* Review feedback (after submit only) */
.review.play-correct .answer-line:not(.bad){animation:flash-good .9s ease-out}
.review.play-wrong .answer-line.bad{animation:shake .5s cubic-bezier(.36,.07,.19,.97),flash-bad .9s ease-out}
.review.play-wrong .answer-line:not(.bad){animation:flash-good .9s ease-out .35s both}
@keyframes flash-good{0%{box-shadow:0 0 0 0 #2f9a6f80}40%{box-shadow:0 0 0 6px #2f9a6f33;filter:brightness(1.06)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flash-bad{0%{box-shadow:0 0 0 0 #b53d4780}40%{box-shadow:0 0 0 6px #b53d4733}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
/* Scroll reveal */
.motion-ok .reveal{opacity:0;transform:translateY(22px)}
.motion-ok .reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease-out) var(--rd,0ms),transform .6s var(--ease-out) var(--rd,0ms)}
/* Reduced motion: keep state changes, drop movement */
@media(prefers-reduced-motion:reduce){.flash-inner{transition:none!important}.flash-face{transition:none!important}.fx-layer{display:none}}

/* ===== Evidence highlight + jump to paragraph ===== */
.text-panel .passage-body .sent{cursor:pointer;border-radius:3px;transition:background-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.text-panel .passage-body .sent:hover{background:color-mix(in srgb,#f2d46b 22%,transparent)}}
.text-panel .passage-body .sent.hl{background:#f6e08a;box-shadow:0 0 0 2px #f6e08a;color:#172e2b}
body[data-theme=dark] .text-panel .passage-body .sent.hl{background:#6b5a1f;box-shadow:0 0 0 2px #6b5a1f;color:#fff6d6}
.passage-body p{scroll-margin-top:72px;border-radius:8px;transition:background-color .4s}
.passage-body p.para-flash{animation:para-flash 1.8s ease-out}
@keyframes para-flash{0%,35%{background:color-mix(in srgb,var(--green) 14%,transparent)}100%{background:transparent}}
mark.term-hit{background:none;color:inherit;border-bottom:3px solid var(--orange);padding:0 1px}
.motion-ok mark.term-hit{animation:term-pop .7s cubic-bezier(.34,1.45,.55,1)}
@keyframes term-pop{0%{border-bottom-color:transparent;background:color-mix(in srgb,var(--orange) 30%,transparent)}100%{background:transparent}}
.hl-hint{font-size:12px;color:var(--muted);padding:10px 20px;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center}
.hl-hint .hl-swatch{width:14px;height:10px;border-radius:2px;background:#f6e08a;flex-shrink:0}
.font-tools .hl-clear{width:auto;padding:2px 9px;color:var(--orange)}
.q-meta .q-tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.para-jump{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--green);font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.para-jump svg{width:13px;height:13px}
@media(hover:hover){.para-jump:hover{background:var(--mint);border-color:#a1bfa6}}
.return-chip{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);z-index:60;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;min-height:48px;border:0;border-radius:999px;background:var(--dark);color:#fff;font-weight:650;font-size:14px;box-shadow:0 12px 30px #0f2a2440}
.motion-ok .return-chip{animation:chip-in .35s cubic-bezier(.2,.75,.25,1)}
@keyframes chip-in{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.return-chip svg{transform:rotate(180deg)}
@media(max-width:960px){
 .passage-body p{scroll-margin-top:calc(150px + env(safe-area-inset-top,0px))}
}
@media(max-width:700px){
 .para-jump{min-height:36px;padding:6px 12px;font-size:12px}
 .hl-hint{padding:10px 16px}
 .font-tools .hl-clear{min-width:0}
 .reading-layout[data-mobile=text]{padding-bottom:72px}
}

/* ===== Tap a word to see its meaning ===== */
.vw{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;letter-spacing:inherit;line-height:inherit;cursor:help;text-decoration:underline dotted color-mix(in srgb,var(--green) 70%,transparent);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:3px;-webkit-tap-highlight-color:transparent;display:inline}
.vw.saved{text-decoration-style:solid;text-decoration-color:var(--orange)}
.vw.locked{cursor:default;text-decoration-color:color-mix(in srgb,var(--muted) 55%,transparent)}
.vw[aria-expanded=true]{background:color-mix(in srgb,var(--green) 16%,transparent)}
@media(hover:hover){.vw:hover{background:color-mix(in srgb,var(--green) 10%,transparent)}}
.word-pop{position:fixed;z-index:200;width:min(340px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px #0f2a2433,0 4px 12px #0f2a241a;padding:16px 16px 14px;font-size:14px;line-height:1.5}
.word-pop:focus{outline:none}
.motion-ok .word-pop{animation:pop-in .22s cubic-bezier(.2,.75,.25,1)}
@keyframes pop-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.word-pop .wp-head{display:flex;align-items:center;gap:10px}
.word-pop .wp-term{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.15;letter-spacing:-.5px}
.word-pop .wp-pos{font-size:13px;font-style:italic;color:var(--muted)}
.word-pop .wp-x{margin-left:auto;width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.word-pop .wp-say{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--green)}
.word-pop .wp-say.speaking{background:var(--mint);border-color:#a1bfa6}
.word-pop .wp-say svg,.word-pop .wp-x svg{width:17px;height:17px}
.word-pop .wp-meaning{font-size:19px;font-weight:650;margin:10px 0 8px}
.word-pop .wp-rel{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0 0 12px}
.word-pop .wp-rel dt{color:var(--muted);font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding-top:2px}
.word-pop .wp-rel dd{margin:0}
.word-pop .wp-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.word-pop .wp-foot .chip{margin-right:auto}
.word-pop .wp-save{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink);min-height:40px}
.word-pop .wp-save svg{width:16px;height:16px}
.word-pop .wp-save[aria-pressed=true]{background:var(--peach);border-color:transparent;color:var(--orange)}
.word-pop .wp-save[aria-pressed=true] svg{fill:currentColor}
.word-pop .wp-lock{color:var(--muted);font-size:13px;margin:8px 0 2px}
.word-pop .wp-src{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:700px){
 .word-pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;border-radius:20px 20px 0 0;border-width:1px 0 0;padding:18px calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px))}
 .motion-ok .word-pop{animation:sheet-in .28s cubic-bezier(.2,.75,.25,1)}
 .word-pop:before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 12px}
 .word-pop .wp-term{font-size:30px}
 .word-pop .wp-x,.word-pop .wp-say{width:44px;height:44px}
 .word-pop .wp-save{min-height:44px;padding:10px 14px;font-size:14px}
}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}

/* ===== Vocab tab pronunciation ===== */
.say-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--paper);display:inline-grid;place-items:center;color:var(--green);flex-shrink:0;transition:background-color .2s,transform .2s}

.say-btn.speaking{background:var(--mint);border-color:#a1bfa6;transform:scale(1.06)}
@media(hover:hover){.say-btn:hover{background:var(--mint)}}
.flash-top .ft-actions{display:flex;align-items:center;gap:6px}
.vocab-table .say-btn{width:32px;height:32px}
.vocab-table .say-btn svg{width:15px;height:15px}
.autosay{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.autosay svg{width:15px;height:15px}
.autosay[aria-pressed=true]{background:var(--mint);color:var(--dark);border-color:#a1bfa6}
.flash-nav .nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.say-btn{width:44px;height:44px}.vocab-table .say-btn{width:40px;height:40px}.autosay{min-height:44px;font-size:13px}}

<script id="study-data" type="application/json">{"chapters": [{"id": 1, "title": "Đánh giá sách và khả năng đạt B1", "html": "\u003ch3>1.1 Sách làm tốt điều gì\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tiêu chí\u003c/th>\u003cth>Bằng chứng trong bản PDF\u003c/th>\u003cth>Ý nghĩa khi học\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Học theo kỹ năng\u003c/td>\u003ctd>Có Nghe, Đọc, Viết và Nói; mục lục PDF 3–4\u003c/td>\u003ctd>Có khung ôn toàn diện, tránh chỉ làm trắc nghiệm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reading được chia nhỏ\u003c/td>\u003ctd>R1 từ vựng; R2 ý chính; R3 chi tiết; R4 phủ định; R5 paraphrase; R6 mục đích; R7 chèn câu\u003c/td>\u003ctd>Dễ nhận diện lỗi và luyện riêng phần yếu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Có bước đệm\u003c/td>\u003ctd>Ví dụ và bài ngắn trước bài dài; phần giới thiệu PDF 21 và Reading PDF 113\u003c/td>\u003ctd>Phù hợp người chưa đủ tốc độ làm ngay đề 40 câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Giải thích ngữ cảnh\u003c/td>\u003ctd>Ví dụ nhiều nghĩa của cool, definition clues và context clues; PDF 114–119\u003c/td>\u003ctd>Hình thành cách đoán nghĩa thay vì dịch từng từ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chú trọng diễn đạt tương đương\u003c/td>\u003ctd>R3 và R5, PDF 139–170\u003c/td>\u003ctd>Rất cần cho Reading vì đáp án thường đổi cách diễn đạt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Có phần nâng cao\u003c/td>\u003ctd>Mục đích và chèn câu; PDF 174–201\u003c/td>\u003ctd>Làm quen yêu cầu vượt mức cơ bản; có ích khi hướng tới B2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Có bài mô phỏng\u003c/td>\u003ctd>Các mục Bài tập dạng thức VSTEP\u003c/td>\u003ctd>Có thể dùng để kiểm tra sau mỗi chuyên đề\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>1.2 Những hạn chế cần xử lý\u003c/h3>\n\u003cp>\u003cstrong>Bản PDF được gửi chưa đủ bộ tài liệu tự học.\u003c/strong> Trang PDF 21 nói đến phần đáp án và lời đọc; trang PDF 366 vẫn yêu cầu xem đáp án và nghe tệp 89.mp3. Tuy nhiên, tệp đính kèm kết thúc ở bài Speaking này, không có phần đáp án/scripts ở cuối. Không có tệp audio riêng trong lần gửi. Nhận xét này áp dụng cho bản bạn cung cấp, không khẳng định ấn bản đầy đủ cũng thiếu.\u003c/p>\n\u003cp>\u003cstrong>Bài luyện từng dạng chưa thay thế được đề Reading đủ 40 câu.\u003c/strong> Các bài đầu chỉ hỏi dạng vừa học, nên điểm cao ở đây chưa chứng minh bạn xử lý được bốn bài dài trong một giờ. Khi đánh giá tiến bộ, dùng đề chưa từng làm, không dùng lại bài đã thuộc đáp án.\u003c/p>\n\u003cp>\u003cstrong>Một số nội dung cần đọc với sự kiểm tra.\u003c/strong> Ví dụ, History of Counting ở PDF 155 có cụm “180 degrees in a rectangle”. Nếu nói tổng góc trong của hình chữ nhật thì phải là 360°. Đây là lỗi nội dung cần đánh dấu. Khi làm câu hỏi “according to the passage”, xác định điều văn bản nói; khi học kiến thức ngoài ngôn ngữ, không xem mọi chi tiết trong sách luyện thi là nguồn chuyên môn.\u003c/p>\n\u003cp>\u003cstrong>Các cặp từ trong bài nối không phải lúc nào cũng thay thế được.\u003c/strong> Chẳng hạn blame và accuse gần nhau về ý quy trách nhiệm nhưng khác cấu trúc: blame somebody for something; accuse somebody of something. Cần học cả cách dùng, không học mỗi dấu bằng.\u003c/p>\n\u003cp>\u003cstrong>Bản scan có chỗ khó đọc.\u003c/strong> Ảnh nền và vùng tô sáng làm một số chữ không rõ. Nếu một câu hoặc lựa chọn bị mất chữ, xem ảnh gốc, không tự lấp chỗ trống rồi học đáp án như thể chắc chắn.\u003c/p>\n\u003ch3>1.3 Học xong có thể đạt B1 chưa\u003c/h3>\n\u003cp>Có thể đạt, nếu sau quá trình học bạn thực hiện được các nhiệm vụ B1 trong đề mới và duy trì kết quả ở cả bốn kỹ năng. Chưa thể dự đoán riêng cho bạn khi chưa có bài làm đầu vào, tốc độ đọc và kết quả Nghe, Viết, Nói.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tình trạng sau khi học\u003c/th>\u003cth>Đánh giá\u003c/th>\u003cth>Việc tiếp theo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Hiểu giải thích nhưng cần dịch gần như từng câu\u003c/td>\u003ctd>Chưa đủ bằng chứng sẵn sàng\u003c/td>\u003ctd>Luyện câu cơ bản, từ vựng và đọc có giới hạn thời gian\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Đúng bài đã học nhưng giảm mạnh ở bài mới\u003c/td>\u003ctd>Có thể đang nhớ đáp án\u003c/td>\u003ctd>Chuyển sang đề chưa làm và ghi bằng chứng cho từng câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Làm đề mới đúng giờ, chỉ ra được lý do chọn và loại\u003c/td>\u003ctd>Reading đang tiến bộ thực chất\u003c/td>\u003ctd>Kiểm tra thêm qua ít nhất ba đề khác nhau\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reading ổn nhưng chưa có phản hồi Writing và Speaking\u003c/td>\u003ctd>Chưa kết luận B1 toàn bài\u003c/td>\u003ctd>Nhờ người chấm theo tiêu chí của kỳ thi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kết quả thi thử cả bốn kỹ năng ổn định, có khoảng đệm\u003c/td>\u003ctd>Có cơ sở cân nhắc dự thi\u003c/td>\u003ctd>Làm quen thao tác thi tại đơn vị đăng ký\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Mốc tự học gợi ý cho Reading là \u003cstrong>24–28 câu đúng trên 40 ở ba đề mới liên tiếp trong 60 phút\u003c/strong>. Đây là mục tiêu luyện tập có khoảng đệm, \u003cstrong>không phải ngưỡng đỗ chính thức, không phải bảng quy đổi điểm VSTEP\u003c/strong>. Độ khó đề khác nhau, đặc biệt đề tự biên soạn, có thể làm kết quả dao động.\u003c/p>"}, {"id": 2, "title": "Hiểu bài thi trước khi luyện", "html": "\u003ch3>2.1 Cấu trúc và điểm B1\u003c/h3>\n\u003cp>Theo Trung tâm Khảo thí ULIS, Reading VSTEP.3–5 có \u003cstrong>60 phút, 4 bài đọc, 40 câu trắc nghiệm\u003c/strong>, mỗi bài 10 câu; tổng văn bản khoảng \u003cstrong>1.900–2.500 từ\u003c/strong>. Thời gian đã bao gồm thời gian ghi/chuyển câu trả lời theo hình thức thi. Bài kiểm tra nhiều mức từ B1 đến C1, nên người nhắm B1 vẫn có thể gặp câu khó. \u003ca class=\"source-ref\" href=\"#/guide/10\">[S1]\u003c/a>\u003c/p>\n\u003cp>Điểm trung bình bốn kỹ năng được dùng để xác định bậc năng lực, theo quy tắc làm tròn công bố: \u003cstrong>4,0–5,5 là bậc 3 B1; 6,0–8,0 là bậc 4 B2; 8,5–10 là bậc 5 C1\u003c/strong>. Không lấy riêng điểm Reading để kết luận đạt B1. Ví dụ minh họa: Nghe 4,5; Đọc 5,5; Viết 4,0; Nói 4,0 cho trung bình 4,5. \u003ca class=\"source-ref\" href=\"#/guide/10\">[S2, S3]\u003c/a>\u003c/p>\n\u003cp>Không dùng công thức “số câu đúng × 0,25” làm bảng quy đổi chính thức nếu đơn vị tổ chức không công bố áp dụng. Trong sổ tự học, ghi số đúng/40 và thời gian; chỉ ghi điểm thi khi có kết quả hoặc hướng dẫn quy đổi của đơn vị khảo thí. Điều kiện sử dụng chứng chỉ của trường/cơ quan tiếp nhận cần được kiểm tra riêng.\u003c/p>\n\u003ch3>2.2 Phân biệt ba cách đọc\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cách đọc\u003c/th>\u003cth>Câu hỏi cần trả lời\u003c/th>\u003cth>Thao tác\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Skimming\u003c/td>\u003ctd>Bài đang nói gì và triển khai thế nào\u003c/td>\u003ctd>Đọc tiêu đề, câu chủ đề, từ lặp và ý cuối đoạn\u003c/td>\u003ctd>Optical Fiber: định nghĩa → cơ chế → lịch sử → ưu nhược điểm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scanning\u003c/td>\u003ctd>Thông tin cụ thể ở đâu\u003c/td>\u003ctd>Dò tên riêng, năm, thuật ngữ và từ gần nghĩa\u003c/td>\u003ctd>Dò 1977 hoặc telephone companies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Close reading\u003c/td>\u003ctd>Câu đó chính xác có nghĩa gì\u003c/td>\u003ctd>Đọc kỹ vùng bằng chứng, phủ định và quan hệ logic\u003c/td>\u003ctd>Phân biệt send electric signals với send power\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Skimming và scanning giúp đến đúng chỗ; \u003cstrong>đọc kỹ vùng bằng chứng\u003c/strong> mới giúp chọn đúng đáp án. Không có kỹ thuật nào cho phép bỏ qua việc hiểu ý.\u003c/p>\n\u003ch3>2.3 Quy trình cho mỗi bài đọc\u003c/h3>\n\u003col>\u003cli>Xem nhanh câu hỏi để biết có hỏi NOT, từ vựng, năm hay tên riêng nào. Chưa cần đọc kỹ tất cả 40 lựa chọn.\u003c/li>\u003cli>Đọc lướt bài, đặt một nhãn ngắn cho mỗi đoạn: định nghĩa, nguyên nhân, ví dụ, kết quả, hạn chế.\u003c/li>\u003cli>Làm câu có vị trí rõ trước. Dò từ khóa và cách diễn đạt tương đương; đọc thêm câu trước/sau nếu cần.\u003c/li>\u003cli>Trước khi nhìn đáp án lần nữa, tự nói một câu trả lời ngắn bằng tiếng Việt hoặc tiếng Anh.\u003c/li>\u003cli>So bốn lựa chọn. Chọn câu giữ nguyên chủ thể, hành động, phạm vi, thời gian và mức độ chắc chắn.\u003c/li>\u003cli>Nếu chưa có bằng chứng sau khoảng 75–90 giây, đánh dấu và chuyển tiếp. Làm lại khi đã trả lời các câu dễ hơn.\u003c/li>\u003cli>Xử lý ý chính sau khi đã hiểu toàn bài nếu lúc đầu chưa chắc. Kiểm tra câu phủ định và các câu chưa chọn trước khi hết giờ.\u003c/li>\u003c/ol>\n\u003cp>Một lịch 60 phút để thử: \u003cstrong>2 phút xem tổng thể + 12 phút bài 1 + 13 phút bài 2 + 14 phút bài 3 + 14 phút bài 4 + 5 phút rà soát\u003c/strong>. Đây là lịch luyện tập, không phải quy định bắt buộc; có thể đổi thứ tự nếu giao diện cho phép. Đừng mặc định bài đầu luôn dễ nhất hoặc bỏ hẳn bài cuối.\u003c/p>\n\u003ch3>2.4 Cách xử lý câu dài\u003c/h3>\n\u003cp>Tìm \u003cstrong>ai/cái gì + làm gì + với cái gì\u003c/strong> trước. Tạm để phần bổ sung trong ngoặc, rồi ráp lại ý. Ví dụ ở bài Carver, PDF 199: “He managed to get an advanced degree in botany, which is the study of plants.” Phần chính là He managed to get a degree; in botany nêu ngành học; which is the study of plants giải thích botany. Bạn không cần biết sẵn botany vẫn đoán được nghĩa.\u003c/p>\n\u003cp>Các tín hiệu cần nhận ra: because/as/since chỉ nguyên nhân tùy ngữ cảnh; although/despite chỉ nhượng bộ; if/unless chỉ điều kiện; who/which/that thường mở phần bổ nghĩa; not only…but also nối hai ý cùng đúng. Hãy gạch rõ not, only, few, most, may và must: một từ nhỏ có thể đổi cả đáp án.\u003c/p>"}, {"id": 3, "title": "Hướng dẫn từng dạng câu hỏi dựa trên sách", "html": "\u003ch3>3.1 Từ vựng trong ngữ cảnh theo R1\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> closest in meaning to, most likely means, could best be replaced by. \u003cstrong>Cách làm:\u003c/strong> xác định từ loại → đọc câu chứa từ và vùng lân cận → tìm định nghĩa, ví dụ hoặc đối lập → dự đoán nghĩa → thử thay lựa chọn vào câu.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Pine Trees, PDF 122, câu 1.\u003c/strong> Bài mô tả resin là một “sticky, glue-like fluid”. Các lựa chọn là oil, liquid, blood và chemical. Đáp án \u003cstrong>B, liquid\u003c/strong>: fluid chỉ chất lỏng. Oil quá hẹp; blood sai ngữ cảnh; chemical là một nhóm chất, không diễn đạt đúng đặc tính đang được hỏi. Bạn chỉ cần mạch mô tả nhựa cây, không cần dịch cả bài.\u003c/p>\n\u003cp>\u003cstrong>Pine Trees, câu 2.\u003c/strong> Nón thông mở vỏ để “release the seeds”. Chọn \u003cstrong>A, free\u003c/strong>: giải phóng/để hạt thoát ra. Restore là khôi phục; break là làm vỡ; burn là đốt. Từ forest fires có trong bài không khiến burn thành đáp án; đó là một tác nhân giúp vỏ mở, không phải nghĩa của release.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ root, PDF 121.\u003c/strong> “Ancient Greece is thought to be the root of European cultures.” Root ở đây là nguồn gốc/nền tảng; chọn \u003cstrong>A, basis\u003c/strong>, không chọn underground chỉ vì bạn từng học root là rễ cây. Mẹo có ích: nếu một nghĩa quen thuộc làm câu vô lý, quay về ngữ cảnh.\u003c/p>\n\u003ch3>3.2 Ý chính và tiêu đề theo R2\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> main idea, mainly discuss, best title. \u003cstrong>Cách làm:\u003c/strong> viết chủ đề + điều tác giả nói về chủ đề; đối chiếu với tất cả các đoạn. Đáp án phải đủ rộng để bao quát nhưng không rộng hơn bài.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Mural Art, PDF 126.\u003c/strong> Bài đi từ tranh hang động đến nghệ sĩ châu Âu và tranh tường hiện đại. Chọn \u003cstrong>B: Mural art has a long and interesting history.\u003c/strong> A nói về điều nghệ thuật dạy ta, rộng hơn nội dung thực; C nói có thể vẽ ở bất cứ đâu, không phải trọng tâm; D nói vật liệu vẽ, không bao quát tiến trình lịch sử.\u003c/p>\n\u003cp>Đừng chỉ đọc câu đầu/cuối rồi chốt. Sách cũng lưu ý điều này: câu cuối Mural Art là một lời gợi ý vẽ tranh tường, nhưng cả bài không chủ yếu hướng dẫn bạn vẽ. Tự kiểm tra bằng câu: “Nếu đặt tiêu đề này, phần lớn nội dung có nằm dưới nó không?”\u003c/p>\n\u003ch3>3.3 Chi tiết theo R3\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> according to, it is stated, who/when/where/why/how. \u003cstrong>Cách làm:\u003c/strong> xác định đúng phạm vi đoạn → dò từ khóa → đọc kỹ câu chứng minh → so ý, không so số từ trùng nhau.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Optical Fiber, PDF 140–141, câu 4.\u003c/strong> Hỏi copper cable từng được dùng để làm gì. Bằng chứng mở đầu đoạn 4 là copper cable was used to send electric signals. Chọn \u003cstrong>D, send electric signals\u003c/strong>. B nói việc chiếu sáng dòng nước, thuộc lịch sử sử dụng nguyên lý quang học; C nói nhìn trong dạ dày, thuộc công cụ y tế; A đảo sai quan hệ vật liệu.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ câu 5 cùng bài.\u003c/strong> Hỏi điều đúng ở đoạn 5 về optical fibers. Chọn \u003cstrong>C, cannot carry power\u003c/strong> vì văn bản nói cannot send power along with a signal. Cannot carry và cannot send diễn đạt tương đương trong câu này. Đừng chọn “many disadvantages”: bài giới hạn nhược điểm trong một số tình huống, không khẳng định nhược điểm rất nhiều.\u003c/p>\n\u003ch3>3.4 Câu phủ định theo R4\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> NOT true, NOT mentioned, EXCEPT, LEAST likely. Viết một dấu nhắc “tìm ngoại lệ” trước khi làm. Kiểm chứng từng lựa chọn; ba lựa chọn được hỗ trợ thì lựa chọn còn lại là ứng viên cần kiểm tra.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Acid Rain, PDF 154, câu 3.\u003c/strong> Hỏi điều NOT stated trong đoạn 3. A thay đổi pH của đất, B ngăn cây tăng trưởng, D có liên hệ với bệnh ở cây đều được đoạn văn hỗ trợ. Chọn \u003cstrong>C, turns rivers into strong acid\u003c/strong> vì đoạn 3 không nêu thông tin về sông. Có thể bạn biết mưa axit ảnh hưởng nước, nhưng kiến thức ngoài bài không làm một ý trở thành “đã được nhắc”.\u003c/p>\n\u003cp>\u003cstrong>NOT mentioned khác NOT true:\u003c/strong> chưa được nói đến không có nghĩa là sai ngoài đời. Với EXCEPT, có khi ngoại lệ trái bài, có khi không được hỗ trợ, tùy câu dẫn. Đừng tự đổi câu hỏi sang “ý nào sai tuyệt đối”.\u003c/p>\n\u003ch3>3.5 Diễn đạt tương đương theo R5\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> best paraphrases, essential information, highlighted sentence. Tách câu gốc thành các mệnh đề; giữ nguyên ai làm gì, nguyên nhân/kết quả, thời gian, điều kiện, so sánh và mức độ.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Snowflakes, PDF 165.\u003c/strong> Câu gốc nói hình dạng bông tuyết được quyết định bởi nhiệt độ. Chọn \u003cstrong>C: The shape of snowflakes depends on the temperature.\u003c/strong> A đảo chiều quan hệ thành dùng hình dạng để dự đoán nhiệt độ; B đổi shape thành size; D bỏ mất nội dung trọng tâm là hình dạng.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Carver, PDF 199–200, câu 6.\u003c/strong> Nếu trồng bông liên tiếp thì chất lượng đất giảm. Chọn \u003cstrong>A: The soil will get worse due to repeated planting of cotton.\u003c/strong> B chỉ nói dùng cùng đất, bỏ kết quả; C biến giảm chất lượng thành giảm lượng đất; D đổi đối tượng bị giảm chất lượng thành cây bông.\u003c/p>\n\u003cp>Các phép đổi thường gặp: buy → purchase; help → enable somebody to; because → so với vị trí hai vế được điều chỉnh; active → passive; carefully → in a careful way; not as…as → so sánh hơn theo chiều ngược lại. Chỉ đồng nghĩa khi toàn bộ câu vẫn giữ ý.\u003c/p>\n\u003ch3>3.6 Mục đích theo R6\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> Why does the author mention…; in order to; purpose. Hỏi \u003cstrong>vì sao tác giả đưa chi tiết vào\u003c/strong>, không chỉ hỏi chi tiết đó có nghĩa gì. Đọc câu trước và câu sau ví dụ để tìm ý mà ví dụ đang phục vụ.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Magnets, PDF 175.\u003c/strong> Tác giả nhắc Magnesia để giải thích nguồn gốc của từ magnetism. Chọn \u003cstrong>C: To point out that the word for magnetism has an origin.\u003c/strong> B đòi hỏi so sánh hai nơi nhưng bài không làm vậy; D suy thành nam châm ở khắp nơi, vượt thông tin.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Vietnamese New Year, PDF 179.\u003c/strong> Tác giả nói món ăn mang ý nghĩa đặc biệt rồi nêu bánh nếp tượng trưng cho trời và đất. Đáp án sát nhất là \u003cstrong>B: To give an example of a food with a certain meaning.\u003c/strong> D chỉ nói ví dụ món ăn Tết, có liên quan nhưng bỏ mất chức năng giải thích ý nghĩa biểu tượng.\u003c/p>\n\u003cp>Nhóm động từ hữu ích: illustrate = minh họa; explain = giải thích; compare = so sánh; contrast = làm rõ khác biệt; support = hỗ trợ lập luận; warn = cảnh báo; criticize = phê bình; persuade = thuyết phục.\u003c/p>\n\u003ch3>3.7 Chèn câu theo R7\u003c/h3>\n\u003cp>\u003cstrong>Nhận diện:\u003c/strong> In which space…will the following sentence fit? Đọc câu cần chèn trước. Khoanh từ móc nối: this, these, such, another, however, therefore, also, he/she/it. Tìm ý mà từ đó quy chiếu, rồi kiểm tra cả trước lẫn sau vị trí chèn.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ Astronauts, PDF 192.\u003c/strong> Câu cần chèn bắt đầu “Based on this definition” và nói 454 người. Đoạn văn đưa định nghĩa của Hoa Kỳ trước, sau đó dùng However để giới thiệu định nghĩa FAI với con số khác. Chọn \u003cstrong>[B]\u003c/strong>, ngay sau định nghĩa Hoa Kỳ, trước However. “This definition” có chỗ bám rõ; hai hệ định nghĩa được giữ tách biệt. Các con số là dữ kiện trong bài sách, không dùng như số liệu hiện hành.\u003c/p>\n\u003cp>\u003cstrong>Ví dụ The Big Dipper, PDF 193, câu 1.\u003c/strong> Câu cần chèn nói “This is why Ursa Major is also called the Great Bear.” Chọn \u003cstrong>[1D]\u003c/strong>, ngay sau câu mô tả hình sắp xếp các sao giống một con gấu. This quy chiếu cả ý trước đó, không chỉ một danh từ gần nhất.\u003c/p>\n\u003cp>Không chèn chỉ vì thấy một từ lặp. Hãy đọc chuỗi ba câu: câu trước → câu chèn → câu sau. Nếu đại từ không rõ hoặc mạch ý nhảy đột ngột, thử vị trí khác.\u003c/p>\n\u003ch3>3.8 Đại từ quy chiếu\u003c/h3>\n\u003cp>Dạng này xuất hiện trong bài tập tổng hợp dù không có một chương riêng cùng cấp R1–R7. Hỏi refers to, they/them/which/this. Kiểm tra số ít/số nhiều, ngữ pháp và nghĩa; thay danh từ vào chỗ đại từ để thử.\u003c/p>\n\u003cp>\u003cstrong>Optical Fiber, PDF 141, câu 2:\u003c/strong> “telephone companies began to use fiber optic cables. They used them to send telephone signals…” They là các công ty, \u003cstrong>them là fiber optic cables, đáp án B\u003c/strong>. Không thể thay them bằng companies vì công ty dùng cáp để truyền tín hiệu, không dùng các công ty làm vật truyền.\u003c/p>\n\u003cp>\u003cstrong>Carver, PDF 199–200, câu 2:\u003c/strong> which occurred in January 1865 quy chiếu sự chấm dứt chế độ nô lệ tại Missouri, \u003cstrong>C, the end of slavery\u003c/strong>. Danh từ đứng gần nhất không tự động là đáp án; “Missouri xảy ra vào tháng 1” không có nghĩa.\u003c/p>\n\u003ch3>3.9 Suy luận và thái độ\u003c/h3>\n\u003cp>\u003cstrong>Suy luận:\u003c/strong> inferred, implied, suggests, most likely. Viết “dữ kiện trong bài → kết luận nhỏ nhất hợp lý”. Không thêm giả định lớn. \u003cstrong>French Quarter, PDF 182–183, câu 1:\u003c/strong> có ảnh hưởng từ nhiều nền văn hóa → \u003cstrong>B, is not built in a single style\u003c/strong>. Không đủ cơ sở suy ra khu phố mới xây hoặc nằm ngoài thành phố.\u003c/p>\n\u003cp>\u003cstrong>Thái độ:\u003c/strong> tìm từ đánh giá và mức độ khẳng định. Ví dụ tự biên soạn: “The scheme is promising, although its long-term costs remain uncertain.” Thái độ phù hợp là cautiously optimistic, lạc quan có dè dặt; không phải hoàn toàn phản đối hoặc tin chắc thành công. Tránh nhầm thái độ của người được trích lời với thái độ tác giả.\u003c/p>\n\u003ch3>3.10 Những mẹo nên dùng và mẹo nên bỏ\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nên dùng\u003c/th>\u003cth>Vì sao\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tự trả lời ngắn trước khi so lựa chọn\u003c/td>\u003ctd>Giảm ảnh hưởng của đáp án gây nhiễu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tìm paraphrase và giữ mức độ\u003c/td>\u003ctd>Most không bằng all; may không bằng must\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ghi bằng chứng cho câu đúng khi chữa\u003c/td>\u003ctd>Phân biệt hiểu bài với đoán trúng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Xem lại câu hỏi sau khi tìm thông tin\u003c/td>\u003ctd>Tránh trả lời đúng thông tin nhưng sai yêu cầu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Làm câu dễ trước và đặt giới hạn thời gian\u003c/td>\u003ctd>Giữ cơ hội lấy điểm ở các câu còn lại\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chọn một phương án tốt nhất cho câu còn trống trước khi hết giờ\u003c/td>\u003ctd>Hoàn thành bài theo hướng dẫn làm bài; không bỏ sót vì mắc ở một câu\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Không có quy tắc đáng tin rằng đáp án dài nhất thường đúng, câu có từ giống bài luôn đúng, hoặc đáp án C xuất hiện nhiều hơn. Từ tuyệt đối như always/never là dấu hiệu cần kiểm tra, \u003cstrong>không phải lý do tự động loại\u003c/strong>. Câu hỏi chi tiết có thể gần thứ tự văn bản nhưng không nên xem đó là luật. Một tên khoa học lạ có thể không cần học thuộc nếu bài đã giải thích nó.\u003c/p>"}, {"id": 4, "title": "Thực hành có hướng dẫn với hai bài dài trong sách", "html": "\u003ch3>4.1 The French Quarter ở PDF 182 đến 184\u003c/h3>\n\u003cp>Làm 10 câu trong 14 phút trước khi xem phần này. Chỉ dùng nội dung bài, không cần tra lịch sử New Orleans. Bản đồ sáu đoạn: 1 nhiều nền văn hóa; 2 ảnh hưởng Pháp; 3 ảnh hưởng Tây Ban Nha; 4 ảnh hưởng West Indies và khí hậu; 5 thiệt hại sau bão; 6 giá trị di sản và du lịch.\u003c/p>\n\u003cp>\u003cstrong>Câu 1 — B — Suy luận.\u003c/strong> Đoạn 1 nêu ảnh hưởng từ nhiều nền văn hóa, nên kiến trúc không chỉ theo một phong cách. A trái vị trí được nêu; C trái thông tin oldest neighborhood; D biến nhiều ảnh hưởng thành một nền văn hóa duy nhất.\u003c/p>\n\u003cp>\u003cstrong>Câu 2 — A — Từ vựng.\u003c/strong> Spotted nghĩa là seen, được nhìn thấy/nhận ra. Circled là khoanh tròn; taken là lấy; interested không phù hợp nghĩa và cấu trúc. Thử câu “The influences…can be seen in it.”\u003c/p>\n\u003cp>\u003cstrong>Câu 3 — D — NOT true.\u003c/strong> Đoạn 2 nói còn rất ít tòa nhà có thiết kế thuần Pháp. D nói nhiều tòa nhà hiện nay có thiết kế Pháp, trái với very few. A được hỗ trợ bởi năm 1718; B được hỗ trợ bởi việc người Pháp lập quy hoạch; C có walled town. Đọc rõ phần “thuần Pháp” trong bằng chứng, không nhầm quy hoạch cả khu với thiết kế từng tòa nhà.\u003c/p>\n\u003cp>\u003cstrong>Câu 4 — D — Chi tiết.\u003c/strong> Spain took possession of New Orleans from France in 1762. D giữ đúng bên nhận, nơi được nhận và thế kỷ. A đảo bên cho/nhận; B và C đổi đối tượng sở hữu thành nước Pháp.\u003c/p>\n\u003cp>\u003cstrong>Câu 5 — D — Suy luận gần.\u003c/strong> Đoạn 3 mô tả sân trong kiểu Tây Ban Nha đầy cây và hoa. D là đặc điểm có căn cứ. B nói ngôi nhà nằm trong sân, không phải ngôi nhà có sân. C đổi vật liệu trang trí thành vật liệu của toàn bộ nhà; A đổi sang phong cách Pháp.\u003c/p>\n\u003cp>\u003cstrong>Câu 6 — B — Mục đích.\u003c/strong> Khí hậu nóng giải thích vì sao kiểu nhà của West Indies có giải pháp làm mát và được mang vào French Quarter. A nói cư dân phải chuyển đi, không được nêu; C cần một sự khác biệt khí hậu mà bài không khẳng định; D nhầm vị trí địa lý.\u003c/p>\n\u003cp>\u003cstrong>Câu 7 — C — Quy chiếu.\u003c/strong> Them trong đoạn 4 quy chiếu houses. Thử thay thành “help keep the houses cool” hoặc “people living in the houses”. Cả nghĩa và số nhiều đều phù hợp; không chọn people chỉ vì đoạn có nói đến người ở.\u003c/p>\n\u003cp>\u003cstrong>Câu 8 — C — Mục đích cả đoạn.\u003c/strong> West Indies được nhắc để giải thích một nguồn ảnh hưởng đến kiến trúc. B gán cho người West Indies việc thành lập thành phố; D tạo phép so sánh mạnh/yếu không có; A không bao quát vai trò giải thích các đặc điểm nhà.\u003c/p>\n\u003cp>\u003cstrong>Câu 9 — C — Định nghĩa ngay trong bài.\u003c/strong> “Verandas, or covered porches” cung cấp trực tiếp từ diễn giải. Chọn porches. Tín hiệu or ở đây giải thích tên gọi, không nêu hai vật khác nhau. Floors, stones và stories đều là từ liên quan kiến trúc nhưng không đúng nghĩa.\u003c/p>\n\u003cp>\u003cstrong>Câu 10 — [C] — Chèn câu.\u003c/strong> Câu về phần lớn công trình lớn chỉ chịu hư hại nhẹ nối tiếp nhóm thông tin về mức thiệt hại vật chất. Sau đó “In addition” chuyển sang chuyện cướp bóc/bạo lực. [A] và [B] chen vào mạch giải thích độ cao và ngập; [D] đặt câu hư hại vật chất sau nhóm thông tin an ninh nên mạch yếu hơn. Đây là đáp án biên soạn dựa vào liên kết ý, không phải key nhà xuất bản.\u003c/p>\n\u003cp>\u003cstrong>Sau khi chữa:\u003c/strong> tóm tắt bài bằng ba câu tiếng Việt, rồi ghi ba cặp: spotted → seen; took possession of → got control of; verandas → covered porches. Nếu sai câu 3 vì bỏ sót NOT, ghi lỗi thao tác thay vì kết luận “thiếu từ vựng”.\u003c/p>\n\u003ch3>4.2 George Washington Carver ở PDF 199 đến 201\u003c/h3>\n\u003cp>Làm 10 câu trong 14–16 phút. Bản đồ năm đoạn: 1 thời thơ ấu; 2 cơ hội đi học; 3 học botany và hướng dẫn nông dân; 4 vấn đề đất và cây trồng; 5 dư thừa sản phẩm và tìm công dụng mới. Những nhận định về cây và đất dưới đây là thông tin của đoạn đọc để giải bài, không phải hướng dẫn canh tác.\u003c/p>\n\u003cp>\u003cstrong>Câu 1 — D — NOT stated trong đoạn 1.\u003c/strong> Đoạn này nêu giai đoạn sinh, nơi sinh và tên cha mẹ. Không nêu môn ông học ở trường. Việc Aunt Susan dạy đọc/viết không đồng nghĩa mô tả môn học tại trường. Botany ở đoạn 3 không được đem vào để trả lời câu chỉ hỏi đoạn 1.\u003c/p>\n\u003cp>\u003cstrong>Câu 2 — C — Quy chiếu mệnh đề.\u003c/strong> Which occurred in January 1865 nối với sự kiện chấm dứt chế độ nô lệ tại Missouri. A không đúng vì ngày sinh được nói là không chắc; B là một tiểu bang, không phải sự kiện occurred; D nhầm sang toàn bộ cuộc nội chiến.\u003c/p>\n\u003cp>\u003cstrong>Câu 3 — A — Cụm nhiều nghĩa.\u003c/strong> By his own account nghĩa là theo chính lời ông kể. Account ở đây là lời tường thuật, không phải tài khoản ngân hàng. B bị hấp dẫn bởi nghĩa tiền bạc; C và D là những cách diễn đạt khác, không được ngữ cảnh hỗ trợ.\u003c/p>\n\u003cp>\u003cstrong>Câu 4 — A — Từ vựng.\u003c/strong> Diligently nghĩa là chăm chỉ, nỗ lực; very hard phù hợp với worked. Very easily nói mức dễ; only a little nói lượng ít; occasionally nói tần suất. Đoạn sau về việc đạt bằng cấp củng cố nghĩa nỗ lực học tập.\u003c/p>\n\u003cp>\u003cstrong>Câu 5 — D — Phân loại và phủ định.\u003c/strong> Botany được giải thích ngay là the study of plants. Oak trees, roses và corn là thực vật; sharks là động vật. Không cần biết trước định nghĩa chuyên ngành.\u003c/p>\n\u003cp>\u003cstrong>Câu 6 — A — Paraphrase nguyên nhân và kết quả.\u003c/strong> Trồng bông năm này qua năm khác → chất lượng đất giảm. Get worse diễn đạt quality decreases. C nhầm chất lượng với số lượng; D nhầm đối tượng đất với bông; B không giữ đủ quan hệ nhân quả.\u003c/p>\n\u003cp>\u003cstrong>Câu 7 — A — Suy luận trong phạm vi bài.\u003c/strong> Đoạn 4 đối chiếu việc lấy chất dinh dưỡng với bổ sung chất dinh dưỡng. A giữ đúng hai phía của phép đối lập. B, C, D đều đổi hoặc xóa sự tương phản. Không nâng kết luận của bài thành “mọi hình thức trồng bông đều xấu”.\u003c/p>\n\u003cp>\u003cstrong>Câu 8 — D — Paraphrase lời khuyên.\u003c/strong> Carver nói không nên chỉ trồng bông và không trồng cây khác mỗi năm. D giữ đúng “only cotton”. A đảo người đưa lời khuyên; B cấm trồng bông cùng cây khác, trái ý; C khẳng định chỉ trồng bông là tốt, trái hoàn toàn.\u003c/p>\n\u003cp>\u003cstrong>Câu 9 — C — Mục tiêu nghiên cứu.\u003c/strong> Đoạn 5 nêu vấn đề sản lượng dư thừa và tìm new uses; các sản phẩm mới là cách giải quyết. A là kỹ thuật trồng; B là giống cây; D là biến đậu phộng thành khoai, không có trong bài.\u003c/p>\n\u003cp>\u003cstrong>Câu 10 — [A] — Chèn câu.\u003c/strong> “It added nutrients back to the soil” giải thích thêm kết quả ở câu trước về cải thiện đất. Đặt trước However sẽ tạo mạch: lợi ích → giải thích lợi ích → vấn đề mới. [B]/[C] đã chuyển sang dư thừa sản lượng; [D] nằm giữa nghiên cứu công dụng và sản phẩm phát triển được, nên không phù hợp.\u003c/p>\n\u003cp>\u003cstrong>Bài tập thêm:\u003c/strong> Không nhìn sách, điền bằng ý của bạn: cotton farming repeatedly → soil quality ___; more crops → a surplus → research into new ___. Đáp án về ý: decreases; uses/products. Sau đó viết lại từng câu sai thành “Tôi chọn… vì…, nhưng bằng chứng cho thấy…”.\u003c/p>\n\u003ch3>4.3 Thứ tự dùng các bài dài khác\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Bài trong sách\u003c/th>\u003cth>Trang PDF\u003c/th>\u003cth>Mục tiêu luyện\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bài tổng hợp R2 EX4\u003c/td>\u003ctd>131–132\u003c/td>\u003ctd>Ý chính và kết hợp câu hỏi cơ bản\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Periodic Table\u003c/td>\u003ctd>144–146\u003c/td>\u003ctd>Chi tiết, từ vựng và tổ chức thông tin khoa học\u003c/td>\u003c/tr>\u003ctr>\u003ctd>History of Counting\u003c/td>\u003ctd>155–157\u003c/td>\u003ctd>Câu ngoại lệ, timeline và từ thay thế\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paul Revere và bài thơ của Longfellow\u003c/td>\u003ctd>171–173\u003c/td>\u003ctd>Paraphrase, phân biệt mô tả trong thơ với sự kiện trong bài\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The French Quarter\u003c/td>\u003ctd>182–184\u003c/td>\u003ctd>Suy luận, mục đích, quy chiếu và chèn câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>George Washington Carver\u003c/td>\u003ctd>199–201\u003c/td>\u003ctd>Tổng hợp nhiều dạng với logic vấn đề và giải pháp\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Lần đầu làm chậm để học phương pháp. Lần hai giải thích lại không xem lời giải. Dùng bài khác để đo trình độ; làm lại bài cũ chỉ đo mức nhớ và khả năng sửa lỗi. Một bài riêng lẻ không được gọi là “một đề Reading đầy đủ”.\u003c/p>"}, {"id": 5, "title": "Từ vựng ưu tiên cho sách và VSTEP Reading", "html": "\u003cp>Danh sách gồm \u003cstrong>100 mục từ/cụm từ từ phần Reading của sách\u003c/strong> và \u003cstrong>100 mục bổ sung theo chủ đề Reading\u003c/strong>. Đây là tuyển chọn để học có trọng tâm, không phải danh mục toàn bộ từ của 366 trang hoặc bảng xếp hạng tần suất từ đề thật. Từ trong sách được đưa về dạng gốc; ví dụ minh họa bên dưới do người biên soạn viết.\u003c/p>\n\u003cp>Ký hiệu n = danh từ; v = động từ; adj = tính từ; adv = trạng từ; prep = giới từ; conj = liên từ. Cột gần nghĩa có cả diễn giải dễ hiểu. Cặp trái nghĩa chỉ áp dụng cho nghĩa đang học; dấu — nghĩa là không đưa một từ đối lập hữu ích. Không ép mọi từ phải có synonym/antonym một từ.\u003c/p>\n\u003ch3>5.1 Một trăm mục từ trong phần Reading của sách\u003c/h3>\n\u003ch4>Bộ sách 1 Cây thông và vòng đời thực vật\u003c/h4>\n\u003cp>Nguồn: Pine Trees, PDF 122.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>classify (v)\u003c/td>\u003ctd>phân loại\u003c/td>\u003ctd>categorize\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>evergreen (adj)\u003c/td>\u003ctd>xanh quanh năm\u003c/td>\u003ctd>keeping leaves all year\u003c/td>\u003ctd>deciduous\u003c/td>\u003c/tr>\u003ctr>\u003ctd>needle (n)\u003c/td>\u003ctd>lá kim\u003c/td>\u003ctd>a thin pointed leaf\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>resin (n)\u003c/td>\u003ctd>nhựa cây dạng nhựa dính\u003c/td>\u003ctd>a sticky plant substance\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sticky (adj)\u003c/td>\u003ctd>dính\u003c/td>\u003ctd>adhesive\u003c/td>\u003ctd>non-sticky\u003c/td>\u003c/tr>\u003ctr>\u003ctd>fluid (n)\u003c/td>\u003ctd>chất lỏng\u003c/td>\u003ctd>liquid\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cone (n)\u003c/td>\u003ctd>nón thông\u003c/td>\u003ctd>seed-bearing structure\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>seed (n)\u003c/td>\u003ctd>hạt\u003c/td>\u003ctd>a plant&#x27;s reproductive structure\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>mature (adj)\u003c/td>\u003ctd>trưởng thành, phát triển đầy đủ\u003c/td>\u003ctd>fully developed\u003c/td>\u003ctd>immature\u003c/td>\u003c/tr>\u003ctr>\u003ctd>release (v)\u003c/td>\u003ctd>giải phóng, thả ra\u003c/td>\u003ctd>free; let out\u003c/td>\u003ctd>retain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Mature cones release their seeds. → Nón thông trưởng thành giải phóng hạt.\u003c/p>\n\u003ch4>Bộ sách 2 Nghệ thuật và lịch sử\u003c/h4>\n\u003cp>Nguồn: PDF 121, 126–130.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>mural (n)\u003c/td>\u003ctd>tranh tường\u003c/td>\u003ctd>wall painting\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>canvas (n)\u003c/td>\u003ctd>vải dùng để vẽ tranh\u003c/td>\u003ctd>painting cloth\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ancient (adj)\u003c/td>\u003ctd>cổ đại\u003c/td>\u003ctd>very old\u003c/td>\u003ctd>modern\u003c/td>\u003c/tr>\u003ctr>\u003ctd>advanced (adj)\u003c/td>\u003ctd>tiên tiến, phát triển cao\u003c/td>\u003ctd>highly developed\u003c/td>\u003ctd>basic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>accurately (adv)\u003c/td>\u003ctd>một cách chính xác\u003c/td>\u003ctd>correctly\u003c/td>\u003ctd>inaccurately\u003c/td>\u003c/tr>\u003ctr>\u003ctd>unique (adj)\u003c/td>\u003ctd>độc đáo, duy nhất\u003c/td>\u003ctd>one of a kind\u003c/td>\u003ctd>ordinary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>influential (adj)\u003c/td>\u003ctd>có ảnh hưởng lớn\u003c/td>\u003ctd>having a strong effect\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>masterpiece (n)\u003c/td>\u003ctd>kiệt tác\u003c/td>\u003ctd>an outstanding work\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>inspire (v)\u003c/td>\u003ctd>truyền cảm hứng\u003c/td>\u003ctd>motivate\u003c/td>\u003ctd>discourage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>survive (v)\u003c/td>\u003ctd>tồn tại, sống sót\u003c/td>\u003ctd>continue to exist\u003c/td>\u003ctd>perish\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Her work inspired younger artists. → Tác phẩm của bà truyền cảm hứng cho nghệ sĩ trẻ.\u003c/p>\n\u003ch4>Bộ sách 3 Nhân vật và hành động\u003c/h4>\n\u003cp>Nguồn: Tom Sawyer và The Lion King, PDF 128–129.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>character (n)\u003c/td>\u003ctd>nhân vật\u003c/td>\u003ctd>a person in a story\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>chore (n)\u003c/td>\u003ctd>việc nhà thường ngày\u003c/td>\u003ctd>household task\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>naughty (adj)\u003c/td>\u003ctd>nghịch, không nghe lời\u003c/td>\u003ctd>badly behaved\u003c/td>\u003ctd>well-behaved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bravery (n)\u003c/td>\u003ctd>lòng dũng cảm\u003c/td>\u003ctd>courage\u003c/td>\u003ctd>cowardice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>curiosity (n)\u003c/td>\u003ctd>sự tò mò, ham tìm hiểu\u003c/td>\u003ctd>desire to know\u003c/td>\u003ctd>indifference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jealous (adj)\u003c/td>\u003ctd>ghen tị\u003c/td>\u003ctd>envious\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>blame (v)\u003c/td>\u003ctd>đổ lỗi, quy trách nhiệm\u003c/td>\u003ctd>hold responsible\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>defeat (v)\u003c/td>\u003ctd>đánh bại\u003c/td>\u003ctd>beat\u003c/td>\u003ctd>lose to\u003c/td>\u003c/tr>\u003ctr>\u003ctd>forgive (v)\u003c/td>\u003ctd>tha thứ\u003c/td>\u003ctd>pardon\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>treasure (n)\u003c/td>\u003ctd>kho báu\u003c/td>\u003ctd>valuable objects\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: He admitted his mistake and asked his friend to forgive him. → Anh ấy nhận lỗi và xin bạn tha thứ.\u003c/p>\n\u003ch4>Bộ sách 4 Cáp quang và công nghệ\u003c/h4>\n\u003cp>Nguồn: Optical Fiber, PDF 140–141.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>transparent (adj)\u003c/td>\u003ctd>trong suốt\u003c/td>\u003ctd>clear; see-through\u003c/td>\u003ctd>opaque\u003c/td>\u003c/tr>\u003ctr>\u003ctd>transmit (v)\u003c/td>\u003ctd>truyền\u003c/td>\u003ctd>send\u003c/td>\u003ctd>receive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>signal (n)\u003c/td>\u003ctd>tín hiệu\u003c/td>\u003ctd>a message-bearing sign\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reflection (n)\u003c/td>\u003ctd>sự phản xạ\u003c/td>\u003ctd>bouncing back of light\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>principle (n)\u003c/td>\u003ctd>nguyên lý\u003c/td>\u003ctd>basic rule\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>advantage (n)\u003c/td>\u003ctd>lợi thế\u003c/td>\u003ctd>benefit\u003c/td>\u003ctd>disadvantage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>disadvantage (n)\u003c/td>\u003ctd>bất lợi\u003c/td>\u003ctd>drawback\u003c/td>\u003ctd>advantage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>replace (v)\u003c/td>\u003ctd>thay thế\u003c/td>\u003ctd>take the place of\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>splice (v)\u003c/td>\u003ctd>nối hai đầu\u003c/td>\u003ctd>join ends together\u003c/td>\u003ctd>separate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bandwidth (n)\u003c/td>\u003ctd>băng thông, khả năng truyền dữ liệu\u003c/td>\u003ctd>data transmission capacity\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The device transmits signals over long distances. → Thiết bị truyền tín hiệu đi xa.\u003c/p>\n\u003ch4>Bộ sách 5 Lịch sử đếm và hệ thống ký hiệu\u003c/h4>\n\u003cp>Nguồn: History of Counting, PDF 155–157.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>artifact (n)\u003c/td>\u003ctd>hiện vật do con người tạo\u003c/td>\u003ctd>human-made object\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tally (n)\u003c/td>\u003ctd>bản ghi hoặc dấu đếm\u003c/td>\u003ctd>a count or counting record\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>represent (v)\u003c/td>\u003ctd>biểu thị, đại diện\u003c/td>\u003ctd>stand for\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>adopt (v)\u003c/td>\u003ctd>bắt đầu áp dụng\u003c/td>\u003ctd>take up\u003c/td>\u003ctd>reject\u003c/td>\u003c/tr>\u003ctr>\u003ctd>symbol (n)\u003c/td>\u003ctd>ký hiệu\u003c/td>\u003ctd>sign\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>complicated (adj)\u003c/td>\u003ctd>phức tạp\u003c/td>\u003ctd>complex; difficult\u003c/td>\u003ctd>simple\u003c/td>\u003c/tr>\u003ctr>\u003ctd>eliminate (v)\u003c/td>\u003ctd>loại bỏ\u003c/td>\u003ctd>remove\u003c/td>\u003ctd>retain\u003c/td>\u003c/tr>\u003ctr>\u003ctd>principal (adj)\u003c/td>\u003ctd>chính, chủ yếu\u003c/td>\u003ctd>main\u003c/td>\u003ctd>secondary\u003c/td>\u003 dded to improve plant growth\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The researcher worked diligently to find new uses for the crop. → Nhà nghiên cứu chăm chỉ tìm công dụng mới cho cây trồng.\u003c/p>\n\u003ch4>Bộ sách 9 Không gian và quan sát\u003c/h4>\n\u003cp>Nguồn: PDF 190, 192–194.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>telescope (n)\u003c/td>\u003ctd>kính thiên văn\u003c/td>\u003ctd>an instrument for viewing distant objects\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lens (n)\u003c/td>\u003ctd>thấu kính\u003c/td>\u003ctd>a curved optical component\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>astronaut (n)\u003c/td>\u003ctd>phi hành gia\u003c/td>\u003ctd>space traveler\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>definition (n)\u003c/td>\u003ctd>định nghĩa\u003c/td>\u003ctd>explanation of meaning\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>constellation (n)\u003c/td>\u003ctd>chòm sao\u003c/td>\u003ctd>a named star pattern\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>arrangement (n)\u003c/td>\u003ctd>sự sắp xếp\u003c/td>\u003ctd>organization; layout\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>particle (n)\u003c/td>\u003ctd>hạt rất nhỏ\u003c/td>\u003ctd>a tiny piece\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scatter (v)\u003c/td>\u003ctd>tán xạ, phân tán\u003c/td>\u003ctd>spread in different directions\u003c/td>\u003ctd>gather\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reflect (v)\u003c/td>\u003ctd>phản xạ\u003c/td>\u003ctd>send back light\u003c/td>\u003ctd>absorb\u003c/td>\u003c/tr>\u003ctr>\u003ctd>compass (n)\u003c/td>\u003ctd>la bàn\u003c/td>\u003ctd>a direction-finding instrument\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The telescope helps researchers observe distant objects. → Kính thiên văn giúp nhà nghiên cứu quan sát vật thể xa.\u003c/p>\n\u003ch4>Bộ sách 10 Ngôn ngữ câu hỏi và lập luận\u003c/h4>\n\u003cp>Nguồn: Câu hỏi, hướng dẫn R2–R7, PDF 125–201.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa trong bài\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>purpose (n)\u003c/td>\u003ctd>mục đích\u003c/td>\u003ctd>aim; intention\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>indicate (v)\u003c/td>\u003ctd>chỉ ra\u003c/td>\u003ctd>show\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>infer (v)\u003c/td>\u003ctd>suy ra\u003c/td>\u003ctd>draw a conclusion\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>mention (v)\u003c/td>\u003ctd>đề cập\u003c/td>\u003ctd>refer to\u003c/td>\u003ctd>omit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>essential (adj)\u003c/td>\u003ctd>thiết yếu, cốt lõi\u003c/td>\u003ctd>necessary; fundamental\u003c/td>\u003ctd>inessential\u003c/td>\u003c/tr>\u003ctr>\u003ctd>similar (adj)\u003c/td>\u003ctd>tương tự\u003c/td>\u003ctd>alike\u003c/td>\u003ctd>different\u003c/td>\u003c/tr>\u003ctr>\u003ctd>contrast (v)\u003c/td>\u003ctd>đối chiếu để thấy khác biệt\u003c/td>\u003ctd>show differences\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>accurate (adj)\u003c/td>\u003ctd>chính xác\u003c/td>\u003ctd>correct\u003c/td>\u003ctd>inaccurate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>evidence (n)\u003c/td>\u003ctd>bằng chứng\u003c/td>\u003ctd>supporting information\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>uncertain (adj)\u003c/td>\u003ctd>không chắc chắn\u003c/td>\u003ctd>not definite\u003c/td>\u003ctd>certain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The example supports the author&#x27;s main point. → Ví dụ củng cố ý chính của tác giả.\u003c/p>\n\u003ch3>5.2 Một trăm mục bổ sung cho các chủ đề Reading\u003c/h3>\n\u003ch4>Bộ bổ sung 1 Giáo dục\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>curriculum (n)\u003c/td>\u003ctd>chương trình học\u003c/td>\u003ctd>course of study\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>assignment (n)\u003c/td>\u003ctd>bài tập được giao\u003c/td>\u003ctd>task\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>assessment (n)\u003c/td>\u003ctd>sự đánh giá\u003c/td>\u003ctd>evaluation\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tuition (n)\u003c/td>\u003ctd>học phí hoặc việc giảng dạy tùy ngữ cảnh\u003c/td>\u003ctd>instruction; tuition fees\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scholarship (n)\u003c/td>\u003ctd>học bổng\u003c/td>\u003ctd>financial award for study\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>attendance (n)\u003c/td>\u003ctd>sự có mặt, chuyên cần\u003c/td>\u003ctd>presence\u003c/td>\u003ctd>absence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>compulsory (adj)\u003c/td>\u003ctd>bắt buộc\u003c/td>\u003ctd>mandatory; required\u003c/td>\u003ctd>optional\u003c/td>\u003c/tr>\u003ctr>\u003ctd>optional (adj)\u003c/td>\u003ctd>tùy chọn\u003c/td>\u003ctd>not required\u003c/td>\u003ctd>compulsory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>qualification (n)\u003c/td>\u003ctd>bằng cấp, năng lực được công nhận\u003c/td>\u003ctd>credential\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>achievement (n)\u003c/td>\u003ctd>thành tích\u003c/td>\u003ctd>accomplishment\u003c/td>\u003ctd>failure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Attendance is compulsory. → Việc tham dự là bắt buộc.\u003c/p>\n\u003ch4>Bộ bổ sung 2 Việc làm\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>employee (n)\u003c/td>\u003ctd>nhân viên\u003c/td>\u003ctd>worker\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>employer (n)\u003c/td>\u003ctd>người hoặc tổ chức tuyển dụng\u003c/td>\u003ctd>hiring person or organization\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>applicant (n)\u003c/td>\u003ctd>người nộp đơn\u003c/td>\u003ctd>candidate\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>recruit (v)\u003c/td>\u003ctd>tuyển dụng\u003c/td>\u003ctd>hire\u003c/td>\u003ctd>dismiss\u003c/td>\u003c/tr>\u003ctr>\u003ctd>occupation (n)\u003c/td>\u003ctd>nghề nghiệp\u003c/td>\u003ctd>job; profession\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>commute (v)\u003c/td>\u003ctd>đi lại thường xuyên giữa nhà và chỗ làm\u003c/td>\u003ctd>travel to and from work\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>shift (n)\u003c/td>\u003ctd>ca làm việc\u003c/td>\u003ctd>a scheduled work period\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>salary (n)\u003c/td>\u003ctd>lương\u003c/td>\u003ctd>regular pay\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>promotion (n)\u003c/td>\u003ctd>sự thăng chức\u003c/td>\u003ctd>advancement\u003c/td>\u003ctd>demotion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>flexible (adj)\u003c/td>\u003ctd>linh hoạt\u003c/td>\u003ctd>adaptable\u003c/td>\u003ctd>rigid\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Employees can work flexible hours. → Nhân viên có thể làm giờ linh hoạt.\u003c/p>\n\u003ch4>Bộ bổ sung 3 Môi trường và tài nguyên\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>sustainable (adj)\u003c/td>\u003ctd>có thể duy trì lâu dài, bền vững\u003c/td>\u003ctd>viable in the long term\u003c/td>\u003ctd>unsustainable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>renewable (adj)\u003c/td>\u003ctd>có thể tái tạo\u003c/td>\u003ctd>naturally replenished\u003c/td>\u003ctd>non-renewable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conservation (n)\u003c/td>\u003ctd>sự bảo tồn\u003c/td>\u003ctd>protection; preservation\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>habitat (n)\u003c/td>\u003ctd>môi trường sống\u003c/td>\u003ctd>natural home\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>biodiversity (n)\u003c/td>\u003ctd>đa dạng sinh học\u003c/td>\u003ctd>variety of living things\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>emission (n)\u003c/td>\u003ctd>sự hoặc lượng phát thải\u003c/td>\u003ctd>release\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>resource (n)\u003c/td>\u003ctd>tài nguyên, nguồn lực\u003c/td>\u003ctd>a useful supply\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depletion (n)\u003c/td>\u003ctd>sự cạn kiệt\u003c/td>\u003ctd>reduction of a supply\u003c/td>\u003ctd>replenishment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>recycle (v)\u003c/td>\u003ctd>tái chế\u003c/td>\u003ctd>process for reuse\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>efficient (adj)\u003c/td>\u003ctd>hiệu quả về nguồn lực\u003c/td>\u003ctd>using little waste\u003c/td>\u003ctd>inefficient\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Renewable energy can reduce reliance on fossil fuels. → Năng lượng tái tạo có thể giảm phụ thuộc nhiên liệu hóa thạch.\u003c/p>\n\u003ch4>Bộ bổ sung 4 Sức khỏe và lối sống\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>prevent (v)\u003c/td>\u003ctd>ngăn ngừa\u003c/td>\u003ctd>stop from happening\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>recover (v)\u003c/td>\u003ctd>hồi phục\u003c/td>\u003ctd>get better\u003c/td>\u003ctd>deteriorate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>treatment (n)\u003c/td>\u003ctd>sự điều trị\u003c/td>\u003ctd>medical care\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>symptom (n)\u003c/td>\u003ctd>triệu chứng\u003c/td>\u003ctd>a sign of illness\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>balanced (adj)\u003c/td>\u003ctd>cân bằng\u003c/td>\u003ctd>well-proportioned\u003c/td>\u003ctd>unbalanced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sedentary (adj)\u003c/td>\u003ctd>ít vận động\u003c/td>\u003ctd>physically inactive\u003c/td>\u003ctd>active\u003c/td>\u003c/tr>\u003ctr>\u003ctd>beneficial (adj)\u003c/td>\u003ctd>có lợi\u003c/td>\u003ctd>helpful\u003c/td>\u003ctd>harmful\u003c/td>\u003c/tr>\u003ctr>\u003ctd>harmful (adj)\u003c/td>\u003ctd>có hại\u003c/td>\u003ctd>damaging\u003c/td>\u003ctd>beneficial\u003c/td>\u003c/tr>\u003ctr>\u003ctd>adequate (adj)\u003c/td>\u003ctd>đủ, đáp ứng yêu cầu\u003c/td>\u003ctd>sufficient\u003c/td>\u003ctd>inadequate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>risk (n)\u003c/td>\u003ctd>nguy cơ\u003c/td>\u003ctd>possibility of harm\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: A sedentary lifestyle may increase health risks. → Lối sống ít vận động có thể tăng nguy cơ sức khỏe.\u003c/p>\n\u003ch4>Bộ bổ sung 5 Công nghệ và dữ liệu\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>access (n)\u003c/td>\u003ctd>quyền hoặc khả năng tiếp cận\u003c/td>\u003ctd>ability to reach or use\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>device (n)\u003c/td>\u003ctd>thiết bị\u003c/td>\u003ctd>piece of equipment\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>innovation (n)\u003c/td>\u003ctd>đổi mới, sáng kiến\u003c/td>\u003ctd>a new method or idea\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reliable (adj)\u003c/td>\u003ctd>đáng tin cậy\u003c/td>\u003ctd>dependable\u003c/td>\u003ctd>unreliable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>privacy (n)\u003c/td>\u003ctd>sự riêng tư\u003c/td>\u003ctd>control over personal information\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>store (v)\u003c/td>\u003ctd>lưu trữ\u003c/td>\u003ctd>save; keep\u003c/td>\u003ctd>delete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>available (adj)\u003c/td>\u003ctd>sẵn có, có thể dùng\u003c/td>\u003ctd>accessible\u003c/td>\u003ctd>unavailable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>manual (adj)\u003c/td>\u003ctd>bằng tay\u003c/td>\u003ctd>done by hand\u003c/td>\u003ctd>automatic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>automated (adj)\u003c/td>\u003ctd>được tự động hóa\u003c/td>\u003ctd>operated automatically\u003c/td>\u003ctd>manual\u003c/td>\u003c/tr>\u003ctr>\u003ctd>compatible (adj)\u003c/td>\u003ctd>tương thích\u003c/td>\u003ctd>able to work together\u003c/td>\u003ctd>incompatible\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: The device stores data automatically. → Thiết bị tự động lưu dữ liệu.\u003c/p>\n\u003ch4>Bộ bổ sung 6 Đời sống cộng đồng\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>community (n)\u003c/td>\u003ctd>cộng đồng\u003c/td>\u003ctd>a group sharing a place or interests\u003c/td>\u003ctd>—\u003c/td>\u00 amount available\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>purchase (v)\u003c/td>\u003ctd>mua\u003c/td>\u003ctd>buy\u003c/td>\u003ctd>sell\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cost (n)\u003c/td>\u003ctd>chi phí\u003c/td>\u003ctd>expense\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>profit (n)\u003c/td>\u003ctd>lợi nhuận\u003c/td>\u003ctd>financial gain\u003c/td>\u003ctd>loss\u003c/td>\u003c/tr>\u003ctr>\u003ctd>income (n)\u003c/td>\u003ctd>thu nhập\u003c/td>\u003ctd>money received\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>budget (n)\u003c/td>\u003ctd>ngân sách\u003c/td>\u003ctd>spending plan\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>discount (n)\u003c/td>\u003ctd>mức giảm giá\u003c/td>\u003ctd>price reduction\u003c/td>\u003ctd>surcharge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>consumer (n)\u003c/td>\u003ctd>người tiêu dùng\u003c/td>\u003ctd>buyer; user\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scarce (adj)\u003c/td>\u003ctd>khan hiếm\u003c/td>\u003ctd>in short supply\u003c/td>\u003ctd>abundant\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ví dụ: Demand rose while supply remained stable. → Nhu cầu tăng trong khi nguồn cung ổn định.\u003c/p>\n\u003ch4>Bộ bổ sung 8 Nghiên cứu và bằng chứng\u003c/h4>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Từ và từ loại\u003c/th>\u003cth>Nghĩa ưu tiên\u003c/th>\u003cth>Gần nghĩa hoặc diễn giải\u003c/th>\u003cth>Trái nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>research (n)\u003c/td>\u003ctd>nghiên cứu\u003c/td>\u003ctd>systematic investigation\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>survey (n)\u003c/td>\u003ctd>khảo sát\u003c/td>\u003ctd>a structured inquiry\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sample (n)\u003c/td>\u003ctd>mẫu nghiên cứu\u003c/td>\u003ctd>a selected subset\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>finding (n)\u00
